ire no electrostatic work for motion along them. Zero potential at a point does not necessarily imply zero electric field there."]},"application":{"title":"5.4 · Apply the model within its limits","paragraphs":["Equipotential surfaces require no electrostatic work for motion along them. Zero potential at a point does not necessarily imply zero electric field there.","ΔU = qΔV = (+3)(-4) = -12 J."]}},{"id":"concept-5-5","title":"Special Cases in Electrostatics","section":"5.5","asset":"ph05-05","steps":[{"text":"In electrostatic equilibrium, the electric field inside conducting material is zero. This statement does not apply to every cavity containing an internal charge or to a current-carrying conductor.","focus":["part-0"]},{"text":"An equilibrium conductor is equipotential, and excess charge resides on its surface. Surface charge distribution depends on geometry and nearby charges.","focus":["part-1"]},{"text":"A dipole has separated opposite charges and zero net charge. Its far field is not zero everywhere simply because the total charge is zero.","focus":["part-2"]},{"text":"A uniform external field can exert a torque on a dipole without a net translational force. A nonuniform field can also produce a net force.","focus":["part-3"]}],"coreRule":{"title":"5.5 · Special Cases in Electrostatics: the governing relation","paragraphs":["In electrostatic equilibrium, the electric field inside conducting material is zero. This statement does not apply to every cavity containing an internal charge or to a current-carrying conductor.","An equilibrium conductor is equipotential, and excess charge resides on its surface. Surface charge distribution depends on geometry and nearby charges."]},"memoryCue":{"title":"5.5 · Zero net charge can still produce a field; a conductor’s equilibrium interior is different.","paragraphs":["Zero net charge can still produce a field; a conductor’s equilibrium interior is different.","An equilibrium conductor is equipotential, and excess charge resides on its surface. Surface charge distribution depends on geometry and nearby charges."]},"traps":{"title":"5.5 · Check signs, assumptions and meaning","paragraphs":["A dipole has separated opposite charges and zero net charge. Its far field is not zero everywhere simply because the total charge is zero.","A uniform external field can exert a torque on a dipole without a net translational force. A nonuniform field can also produce a net force."]},"application":{"title":"5.5 · Apply the model within its limits","paragraphs":["A uniform external field can exert a torque on a dipole without a net translational force. A nonuniform field can also produce a net force.","Mobile charges redistribute until the internal electric field in the conductor material is zero."]}},{"id":"concept-5-6","title":"Magnetism","section":"5.6","asset":"ph05-06","steps":[{"text":"A moving point charge in a magnetic field experiences F = qv × B, with magnitude |q|vB sin θ. A charge at rest has no magnetic force from this term.","focus":["part-0"]},{"text":"For a positive charge, use the right-hand rule for v × B; reverse the force for a negative charge. The magnetic field direction is not generally the force direction.","focus":["part-1"]},{"text":"A magnetic force perpendicular to velocity changes direction without changing speed when it is the only force. It does no work on an ideal point charge.","focus":["part-2"]},{"text":"A current-carrying wire produces a magnetic field. The field around a long straight wire circles it according to the right-hand rule for conventional current.","focus":["part-3"]}],"coreRule":{"title":"5.6 · Magnetism: the governing relation","paragraphs":["A moving point charge in a magnetic field experiences F = qv × B, with magnitude |q|vB sin θ. A charge at rest has no magnetic force from this term.","For a positive charge, use the right-hand rule for v × B; reverse the force for a negative charge. The magnetic field direction is not generally the force direction."]},"memoryCue":{"title":"5.6 · Magnetic force turns motion; the sign of charge flips the turn.","paragraphs":["Magnetic force turns motion; the sign of charge flips the turn.","For a positive charge, use the right-hand rule for v × B; reverse the force for a negative charge. The magnetic field direction is not generally the force direction."]},"traps":{"title":"5.6 · Check signs, assumptions and meaning","paragraphs":["A magnetic force perpendicular to velocity changes direction without changing speed when it is the only force. It does no work on an ideal point charge.","A current-carrying wire produces a magnetic field. The field around a long straight wire circles it according to the right-hand rule for conventional current."]},"application":{"title":"5.6 · Apply the model within its limits","paragraphs":["A current-carrying wire produces a magnetic field. The field around a long straight wire circles it according to the right-hand rule for conventional current.","F = |q|vB sin 90° = 2 × 3 × 0.5 = 3 N."]}}],"exercises":[{"id":"ph-05-01-workshop-v1","title":"Charges","asset":"ph05-01","stages":[{"id":"map","type":"selection","prompt":"Select the body with excess electrons relative to neutrality.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Negative charge. Electric charge is conserved and occurs in integer multiples of the elementary charge for ordinary isolated particles. A neutral object has balanced positive and negative charge, not an absence of charged constituents.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Like charges repel and unlike charges attract. Charging by contact redistributes charge; polarization separates charge within an initially neutral object."]},{"type":"number","prompt":"A body has charge +8.0×10⁻¹⁹ C. Using e = 1.6×10⁻¹⁹ C, how many electrons is it missing relative to neutrality?","answer":5,"unit":"electrons","tolerance":0,"explanation":"A positive charge of Q/e = 8.0/1.6 = 5 elementary charges corresponds to five missing electrons.","id":"reason","hints":["Electric charge is conserved and occurs in integer multiples of the elementary charge for ordinary isolated particles. A neutral object has balanced positive and negative charge, not an absence of charged constituents.","Like charges repel and unlike charges attract. Charging by contact redistributes charge; polarization separates charge within an initially neutral object."]},{"type":"choice","prompt":"A neutral object is attracted to a charged object. What can explain this?","options":["Creation of net charge from nothing","Only universal magnetic attraction","Neutral matter contains no charges","Polarization of the neutral object"],"answer":3,"explanation":"A nonuniform electric field can attract an induced charge separation even if the object has zero total charge.","id":"transfer","hints":["Like charges repel and unlike charges attract. Charging by contact redistributes charge; polarization separates charge within an initially neutral object.","In ordinary solid conductors, mobile electrons move while positive lattice ions remain approximately fixed. Conventional positive-current direction need not match electron drift."]}]},{"id":"ph-05-02-workshop-v1","title":"Coulomb’s Law","asset":"ph05-02","stages":[{"id":"map","type":"selection","prompt":"Select the geometric quantity that enters the inverse-square denominator.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Separation. For point charges in vacuum, Coulomb-force magnitude is k|q1q2|/r². The force lies along the line joining the charges.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Superposition adds the forces from several sources as vectors. Cancellation depends on direction, not merely on equal magnitudes."]},{"type":"number","prompt":"Two point charges repel with 36 N. Their separation triples with charges and medium fixed. Find the new force magnitude.","answer":4,"unit":"N","tolerance":0,"explanation":"F scales as 1/r², so Fnew = 36/3² = 4 N.","id":"reason","hints":["For point charges in vacuum, Coulomb-force magnitude is k|q1q2|/r². The force lies along the line joining the charges.","Superposition adds the forces from several sources as vectors. Cancellation depends on direction, not merely on equal magnitudes."]},{"type":"number","prompt":"A +2 C test charge experiences +10 N along x. Find Ex.","answer":5,"unit":"N/C","tolerance":0,"explanation":"Ex = Fx/q = 10/2 = +5 N/C.","id":"transfer","hints":["Superposition adds the forces from several sources as vectors. Cancellation depends on direction, not merely on equal magnitudes.","Doubling separation divides force by four when the charges and medium are unchanged. The inverse-square law concerns center-to-center separation in the point-charge approximation."]}]},{"id":"ph-05-03-workshop-v1","title":"Electric Potential Energy","asset":"ph05-03","stages":[{"id":"map","type":"selection","prompt":"Select the configuration property that changes oppositely to electrostatic field work.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Potential energy. For two point charges in vacuum with zero energy at infinite separation, electric potential energy is U = kq1q2/r. Its sign depends on the signed charge product.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Like-charge pairs have positive U in this convention; opposite-charge pairs have negative U. A negative potential energy is compatible with a stable choice of zero at infinity."]},{"type":"number","prompt":"An electrostatic field does +12 J of work on a charge. Find the change in electric potential energy.","answer":-12,"unit":"J","tolerance":0,"explanation":"Wfield = -ΔU, so ΔU = -12 J.","id":"reason","hints":["For two point charges in vacuum with zero energy at infinite separation, electric potential energy is U = kq1q2/r. Its sign depends on the signed charge product.","Like-charge pairs have positive U in this convention; opposite-charge pairs have negative U. A negative potential energy is compatible with a stable choice of zero at infinity."]},{"type":"choice","prompt":"With U = 0 at infinite separation, what is U for two opposite point charges at finite separation?","options":["Always positive","Negative","Exactly zero","Undefined for any separation"],"answer":1,"explanation":"U = kq1q2/r is negative when q1q2 is negative under this reference convention.","id":"transfer","hints":["Like-charge pairs have positive U in this convention; opposite-charge pairs have negative U. A negative potential energy is compatible with a stable choice of zero at infinity.","For an electrostatic field, work done by the field equals -ΔU. External quasistatic work with no kinetic-energy change equals +ΔU."]}]},{"id":"ph-05-04-workshop-v1","title":"Electric Potential","asset":"ph05-04","stages":[{"id":"map","type":"selection","prompt":"Select the direction quantity pointing toward decreasing electric potential.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Electric field. Electric potential is potential energy per charge: V = U/q. A potential difference has units joules per coulomb, called volts.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A charge moving across ΔV changes electric potential energy by qΔV. A negative charge reverses the energy-change sign relative to a positive charge."]},{"type":"number","prompt":"A +3 C charge moves across ΔV = -4 V. Find ΔU.","answer":-12,"unit":"J","tolerance":0,"explanation":"ΔU = qΔV = (+3)(-4) = -12 J.","id":"reason","hints":["Electric potential is potential energy per charge: V = U/q. A potential difference has units joules per coulomb, called volts.","A charge moving across ΔV changes electric potential energy by qΔV. A negative charge reverses the energy-change sign relative to a positive charge."]},{"type":"number","prompt":"A uniform Ex = +20 V/m extends over Δx = +0.5 m. Find ΔV.","answer":-10,"unit":"V","tolerance":0,"explanation":"ΔV = -ExΔx = -20 × 0.5 = -10 V.","id":"transfer","hints":["A charge moving across ΔV changes electric potential energy by qΔV. A negative charge reverses the energy-change sign relative to a positive charge.","For a uniform one-dimensional field, Ex = -ΔV/Δx. The field points toward decreasing potential, while force direction also depends on the sign of the charge."]}]},{"id":"ph-05-05-workshop-v1","title":"Special Cases in Electrostatics","asset":"ph05-05","stages":[{"id":"map","type":"selection","prompt":"Select the region where the equilibrium conductor-material field vanishes.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Interior. In electrostatic equilibrium, the electric field inside conducting material is zero. This statement does not apply to every cavity containing an internal charge or to a current-carrying conductor.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","An equilibrium conductor is equipotential, and excess charge resides on its surface. Surface charge distribution depends on geometry and nearby charges."]},{"type":"number","prompt":"What is the electric-field magnitude within conducting material in electrostatic equilibrium?","answer":0,"unit":"N/C","tolerance":0,"explanation":"Mobile charges redistribute until the internal electric field in the conductor material is zero.","id":"reason","hints":["In electrostatic equilibrium, the electric field inside conducting material is zero. This statement does not apply to every cavity containing an internal charge or to a current-carrying conductor.","An equilibrium conductor is equipotential, and excess charge resides on its surface. Surface charge distribution depends on geometry and nearby charges."]},{"type":"choice","prompt":"A dipole has zero total charge. Which conclusion is valid?","options":["Its field must vanish everywhere","Its two charges must coincide","It cannot experience torque","It may still create a nonzero electric field"],"answer":3,"explanation":"Separated opposite charges generate a dipole field even though total charge is zero.","id":"transfer","hints":["An equilibrium conductor is equipotential, and excess charge resides on its surface. Surface charge distribution depends on geometry and nearby charges.","A dipole has separated opposite charges and zero net charge. Its far field is not zero everywhere simply because the total charge is zero."]}]},{"id":"ph-05-06-workshop-v1","title":"Magnetism","asset":"ph05-06","stages":[{"id":"map","type":"selection","prompt":"Select the force constrained to be perpendicular to both velocity and field.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Magnetic force. A moving point charge in a magnetic field experiences F = qv × B, with magnitude |q|vB sin θ. A charge at rest has no magnetic force from this term.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","For a positive charge, use the right-hand rule for v × B; reverse the force for a negative charge. The magnetic field direction is not generally the force direction."]},{"type":"number","prompt":"A charge of +2 C moves perpendicular to B = 0.5 T at 3 m/s. Find magnetic-force magnitude.","answer":3,"unit":"N","tolerance":0,"explanation":"F = |q|vB sin 90° = 2 × 3 × 0.5 = 3 N.","id":"reason","hints":["A moving point charge in a magnetic field experiences F = qv × B, with magnitude |q|vB sin θ. A charge at rest has no magnetic force from this term.","For a positive charge, use the right-hand rule for v × B; reverse the force for a negative charge. The magnetic field direction is not generally the force direction."]},{"type":"choice","prompt":"A magnetic force alone acts perpendicular to a particle’s velocity. What happens to its speed?","options":["It remains constant","It always increases","It always falls to zero","It becomes a scalar field"],"answer":0,"explanation":"The perpendicular force does no work, so kinetic energy and speed remain constant in the ideal model.","id":"transfer","hints":["For a positive charge, use the right-hand rule for v × B; reverse the force for a negative charge. The magnetic field direction is not generally the force direction.","A magnetic force perpendicular to velocity changes direction without changing speed when it is the only force. It does no work on an ideal point charge."]}]}]},{"version":1,"id":"chapter-06","title":"Circuits","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-6-1","title":"Current","section":"6.1","asset":"ph06-01","steps":[{"text":"Electric current is charge crossing a surface per time: I = ΔQ/Δt. One ampere is one coulomb per second.","focus":["part-0"]},{"text":"Conventional current follows positive-charge flow. In a metal wire, electron drift is opposite conventional current; a complete circuit is needed for sustained steady current.","focus":["part-1"]},{"text":"At a circuit junction, steady charge conservation gives total current in equal to total current out. Charge does not ordinarily accumulate indefinitely at an ideal junction.","focus":["part-2"]},{"text":"Current is not consumed by a resistor. Energy is transferred as charges move through potential differences, while the steady series current is shared by all series elements.","focus":["part-3"]}],"coreRule":{"title":"6.1 · Current: the governing relation","paragraphs":["Electric current is charge crossing a surface per time: I = ΔQ/Δt. One ampere is one coulomb per second.","Conventional current follows positive-charge flow. In a metal wire, electron drift is opposite conventional current; a complete circuit is needed for sustained steady current."]},"memoryCue":{"title":"6.1 · Current carries charge; a resistor transfers energy rather than consuming charge.","paragraphs":["Current carries charge; a resistor transfers energy rather than consuming charge.","Conventional current follows positive-charge flow. In a metal wire, electron drift is opposite conventional current; a complete circuit is needed for sustained steady current."]},"traps":{"title":"6.1 · Check signs, assumptions and meaning","paragraphs":["At a circuit junction, steady charge conservation gives total current in equal to total current out. Charge does not ordinarily accumulate indefinitely at an ideal junction.","Current is not consumed by a resistor. Energy is transferred as charges move through potential differences, while the steady series current is shared by all series elements."]},"application":{"title":"6.1 · Apply the model within its limits","paragraphs":["Current is not consumed by a resistor. Energy is transferred as charges move through potential differences, while the steady series current is shared by all series elements.","Steady current is charge per time, so I = ΔQ/Δt = 18 C / 6 s = 3 A."]}},{"id":"concept-6-2","title":"Resistance","section":"6.2","asset":"ph06-02","steps":[{"text":"An ohmic resistor obeys V = IR over a specified regime. Resistance can depend on temperature, geometry and material; a linear relation is not universal for every device.","focus":["part-0"]},{"text":"Series resistances add and carry the same current. Parallel branches share potential difference and have reciprocal resistances that add.","focus":["part-1"]},{"text":"For a uniform wire, R = ρelectricalL/A. Electrical resistivity is not mass density. Lengthening a wire raises resistance, whereas increasing area lowers it.","focus":["part-2"]},{"text":"Dissipated power is IV, or I²R and V²/R when Ohm’s law applies. Decide whether current or voltage is held fixed before predicting how a resistance change affects power.","focus":["part-3"]}],"coreRule":{"title":"6.2 · Resistance: the governing relation","paragraphs":["An ohmic resistor obeys V = IR over a specified regime. Resistance can depend on temperature, geometry and material; a linear relation is not universal for every device.","Series resistances add and carry the same current. Parallel branches share potential difference and have reciprocal resistances that add."]},"memoryCue":{"title":"6.2 · Series shares current; parallel shares voltage.","paragraphs":["Series shares current; parallel shares voltage.","Series resistances add and carry the same current. Parallel branches share potential difference and have reciprocal resistances that add."]},"traps":{"title":"6.2 · Check signs, assumptions and meaning","paragraphs":["For a uniform wire, R = ρelectricalL/A. Electrical resistivity is not mass density. Lengthening a wire raises resistance, whereas increasing area lowers it.","Dissipated power is IV, or I²R and V²/R when Ohm’s law applies. Decide whether current or voltage is held fixed before predicting how a resistance change affects power."]},"application":{"title":"6.2 · Apply the model within its limits","paragraphs":["Dissipated power is IV, or I²R and V²/R when Ohm’s law applies. Decide whether current or voltage is held fixed before predicting how a resistance change affects power.","For the stated ohmic resistor, I = V/R = 12 V / 4 Ω = 3 A."]}},{"id":"concept-6-3","title":"Capacitance and Capacitors","section":"6.3","asset":"ph06-03","steps":[{"text":"Capacitance relates stored charge magnitude to potential difference: C = Q/V. An ideal parallel-plate model gives C = κε0A/d, neglecting edge fields.","focus":["part-0"]},{"text":"A dielectric increases capacitance for fixed plate geometry. What happens to charge and voltage depends on whether a battery remains connected or the capacitor is isolated.","focus":["part-1"]},{"text":"Stored energy can be written ½CV², Q²/(2C) or ½QV. Increasing capacitance raises energy at fixed voltage but lowers energy at fixed charge.","focus":["part-2"]},{"text":"An ideal capacitor blocks steady direct current after charging, although current flows during transients. The changing field stores energy without sustained conduction across the ideal dielectric.","focus":["part-3"]}],"coreRule":{"title":"6.3 · Capacitance and Capacitors: the governing relation","paragraphs":["Capacitance relates stored charge magnitude to potential difference: C = Q/V. An ideal parallel-plate model gives C = κε0A/d, neglecting edge fields.","A dielectric increases capacitance for fixed plate geometry. What happens to charge and voltage depends on whether a battery remains connected or the capacitor is isolated."]},"memoryCue":{"title":"6.3 · First ask: fixed voltage or fixed charge?","paragraphs":["First ask: fixed voltage or fixed charge?","A dielectric increases capacitance for fixed plate geometry. What happens to charge and voltage depends on whether a battery remains connected or the capacitor is isolated."]},"traps":{"title":"6.3 · Check signs, assumptions and meaning","paragraphs":["Stored energy can be written ½CV², Q²/(2C) or ½QV. Increasing capacitance raises energy at fixed voltage but lowers energy at fixed charge.","An ideal capacitor blocks steady direct current after charging, although current flows during transients. The changing field stores energy without sustained conduction across the ideal dielectric."]},"application":{"title":"6.3 · Apply the model within its limits","paragraphs":["An ideal capacitor blocks steady direct current after charging, although current flows during transients. The changing field stores energy without sustained conduction across the ideal dielectric.","Q = CV = (4 μF)(3 V) = 12 μC."]}},{"id":"concept-6-4","title":"Meters","section":"6.4","asset":"ph06-04","steps":[{"text":"An ammeter measures current and is inserted in series with the branch of interest. An ideal ammeter has zero resistance so it does not appreciably alter that current.","focus":["part-0"]},{"text":"A voltmeter measures potential difference across two points and is connected in parallel. An ideal voltmeter has infinite resistance and draws no current.","focus":["part-1"]},{"text":"A real meter can load a circuit. Placing a low-resistance ammeter directly across a source can create a dangerously high-current path; the schematic is an instructional model, not a wiring procedure.","focus":["part-2"]},{"text":"Read the intended branch and connection before using a meter value. A voltmeter reading depends on both lead placement and the chosen polarity.","focus":["part-3"]}],"coreRule":{"title":"6.4 · Meters: the governing relation","paragraphs":["An ammeter measures current and is inserted in series with the branch of interest. An ideal ammeter has zero resistance so it does not appreciably alter that current.","A voltmeter measures potential difference across two points and is connected in parallel. An ideal voltmeter has infinite resistance and draws no current."]},"memoryCue":{"title":"6.4 · Ammeter in series, voltmeter in parallel.","paragraphs":["Ammeter in series, voltmeter in parallel.","A voltmeter measures potential difference across two points and is connected in parallel. An ideal voltmeter has infinite resistance and draws no current."]},"traps":{"title":"6.4 · Check signs, assumptions and meaning","paragraphs":["A real meter can load a circuit. Placing a low-resistance ammeter directly across a source can create a dangerously high-current path; the schematic is an instructional model, not a wiring procedure.","Read the intended branch and connection before using a meter value. A voltmeter reading depends on both lead placement and the chosen polarity."]},"application":{"title":"6.4 · Apply the model within its limits","paragraphs":["Read the intended branch and connection before using a meter value. A voltmeter reading depends on both lead placement and the chosen polarity.","A voltmeter measures the potential difference across the resistor while ideally drawing no current."]}}],"exercises":[{"id":"ph-06-01-workshop-v1","title":"Current","asset":"ph06-01","stages":[{"id":"map","type":"selection","prompt":"Select the element supplying the circuit’s potential rise.","answer":["part-0"],"explanation":"The relevant diagram entity or entities are Voltage source. Electric current is charge crossing a surface per time: I = ΔQ/Δt. One ampere is one coulomb per second.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Conventional current follows positive-charge flow. In a metal wire, electron drift is opposite conventional current; a complete circuit is needed for sustained steady current."]},{"type":"number","prompt":"A steady 18 C crosses a wire section in 6 s. Find current.","answer":3,"unit":"A","tolerance":0,"explanation":"Steady current is charge per time, so I = ΔQ/Δt = 18 C / 6 s = 3 A.","id":"reason","hints":["Electric current is charge crossing a surface per time: I = ΔQ/Δt. One ampere is one coulomb per second.","Conventional current follows positive-charge flow. In a metal wire, electron drift is opposite conventional current; a complete circuit is needed for sustained steady current."]},{"type":"number","prompt":"A junction receives 5 A and sends 2 A through one branch. Find the outgoing current in its only other branch.","answer":3,"unit":"A","tolerance":0,"explanation":"Charge conservation gives 5 = 2 + Iother, so Iother = 3 A.","id":"transfer","hints":["Conventional current follows positive-charge flow. In a metal wire, electron drift is opposite conventional current; a complete circuit is needed for sustained steady current.","At a circuit junction, steady charge conservation gives total current in equal to total current out. Charge does not ordinarily accumulate indefinitely at an ideal junction."]}]},{"id":"ph-06-02-workshop-v1","title":"Resistance","asset":"ph06-02","stages":[{"id":"map","type":"selection","prompt":"Select both elements whose resistances add in the displayed series arrangement.","answer":["part-1","part-2"],"explanation":"The relevant diagram entity or entities are Series resistor, Second resistor. An ohmic resistor obeys V = IR over a specified regime. Resistance can depend on temperature, geometry and material; a linear relation is not universal for every device.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Series resistances add and carry the same current. Parallel branches share potential difference and have reciprocal resistances that add."]},{"type":"number","prompt":"A 12 V source is across a 4 Ω ohmic resistor. Find current.","answer":3,"unit":"A","tolerance":0,"explanation":"For the stated ohmic resistor, I = V/R = 12 V / 4 Ω = 3 A.","id":"reason","hints":["An ohmic resistor obeys V = IR over a specified regime. Resistance can depend on temperature, geometry and material; a linear relation is not universal for every device.","Series resistances add and carry the same current. Parallel branches share potential difference and have reciprocal resistances that add."]},{"type":"number","prompt":"Find the equivalent resistance of 6 Ω and 3 Ω connected in parallel.","answer":2,"unit":"Ω","tolerance":0,"explanation":"1/Req = 1/6 + 1/3 = 1/2, so Req = 2 Ω.","id":"transfer","hints":["Series resistances add and carry the same current. Parallel branches share potential difference and have reciprocal resistances that add.","For a uniform wire, R = ρelectricalL/A. Electrical resistivity is not mass density. Lengthening a wire raises resistance, whereas increasing area lowers it."],"asset":"ph06-02-parallel"}]},{"id":"ph-06-03-workshop-v1","title":"Capacitance and Capacitors","asset":"ph06-03","stages":[{"id":"map","type":"selection","prompt":"Select the insulating region separating the charged plates.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Dielectric gap. Capacitance relates stored charge magnitude to potential difference: C = Q/V. An ideal parallel-plate model gives C = κε0A/d, neglecting edge fields.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A dielectric increases capacitance for fixed plate geometry. What happens to charge and voltage depends on whether a battery remains connected or the capacitor is isolated."]},{"type":"number","prompt":"A 4 μF capacitor has 3 V across it. Find charge magnitude in microcoulombs.","answer":12,"unit":"μC","tolerance":0,"explanation":"Q = CV = (4 μF)(3 V) = 12 μC.","id":"reason","hints":["Capacitance relates stored charge magnitude to potential difference: C = Q/V. An ideal parallel-plate model gives C = κε0A/d, neglecting edge fields.","A dielectric increases capacitance for fixed plate geometry. What happens to charge and voltage depends on whether a battery remains connected or the capacitor is isolated."]},{"type":"number","prompt":"Find stored energy for C = 2 F and V = 3 V.","answer":9,"unit":"J","tolerance":0,"explanation":"U = ½CV² = ½ × 2 × 3² = 9 J.","id":"transfer","hints":["A dielectric increases capacitance for fixed plate geometry. What happens to charge and voltage depends on whether a battery remains connected or the capacitor is isolated.","Stored energy can be written ½CV², Q²/(2C) or ½QV. Increasing capacitance raises energy at fixed voltage but lowers energy at fixed charge."]}]},{"id":"ph-06-04-workshop-v1","title":"Meters","asset":"ph06-04","stages":[{"id":"map","type":"selection","prompt":"Select the meter that ideally draws no current.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Voltmeter. An ammeter measures current and is inserted in series with the branch of interest. An ideal ammeter has zero resistance so it does not appreciably alter that current.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A voltmeter measures potential difference across two points and is connected in parallel. An ideal voltmeter has infinite resistance and draws no current."]},{"type":"choice","prompt":"How is an ideal voltmeter connected to measure a resistor’s voltage?","options":["In series replacing every wire","As a short across the battery","In parallel across the resistor","Without contacting two circuit points"],"answer":2,"explanation":"A voltmeter measures the potential difference across the resistor while ideally drawing no current.","id":"reason","hints":["An ammeter measures current and is inserted in series with the branch of interest. An ideal ammeter has zero resistance so it does not appreciably alter that current.","A voltmeter measures potential difference across two points and is connected in parallel. An ideal voltmeter has infinite resistance and draws no current."]},{"type":"choice","prompt":"What ideal resistance minimizes an ammeter’s effect on branch current?","options":["Infinite resistance","Exactly the load resistance","A negative infinite resistance","Zero resistance"],"answer":3,"explanation":"An ideal ammeter has zero resistance and is inserted in series.","id":"transfer","hints":["A voltmeter measures potential difference across two points and is connected in parallel. An ideal voltmeter has infinite resistance and draws no current.","A real meter can load a circuit. Placing a low-resistance ammeter directly across a source can create a dangerously high-current path; the schematic is an instructional model, not a wiring procedure."]}]}]},{"version":1,"id":"chapter-07","title":"Waves and Sound","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-7-1","title":"General Wave Characteristics","section":"7.1","asset":"ph07-01","steps":[{"text":"A periodic wave is described by amplitude, wavelength, frequency and period. Frequency is inverse period, and wave speed is v = fλ for the specified wave and medium.","focus":["part-0"]},{"text":"Amplitude measures disturbance size, not the distance between successive crests. Wavelength is a spatial period, while ordinary period is a time interval.","focus":["part-1"]},{"text":"Superposition adds displacements when the medium behaves linearly. Interference can enhance or cancel the local disturbance without implying that all energy has disappeared.","focus":["part-2"]},{"text":"Standing waves arise from suitable counterpropagating waves. Boundary conditions determine nodes, antinodes and allowed wavelengths, so endpoint type matters.","focus":["part-3"]}],"coreRule":{"title":"7.1 · General Wave Characteristics: the governing relation","paragraphs":["A periodic wave is described by amplitude, wavelength, frequency and period. Frequency is inverse period, and wave speed is v = fλ for the specified wave and medium.","Amplitude measures disturbance size, not the distance between successive crests. Wavelength is a spatial period, while ordinary period is a time interval."]},"memoryCue":{"title":"7.1 · Wavelength is space; period is time.","paragraphs":["Wavelength is space; period is time.","Amplitude measures disturbance size, not the distance between successive crests. Wavelength is a spatial period, while ordinary period is a time interval."]},"traps":{"title":"7.1 · Check signs, assumptions and meaning","paragraphs":["Superposition adds displacements when the medium behaves linearly. Interference can enhance or cancel the local disturbance without implying that all energy has disappeared.","Standing waves arise from suitable counterpropagating waves. Boundary conditions determine nodes, antinodes and allowed wavelengths, so endpoint type matters."]},"application":{"title":"7.1 · Apply the model within its limits","paragraphs":["Standing waves arise from suitable counterpropagating waves. Boundary conditions determine nodes, antinodes and allowed wavelengths, so endpoint type matters.","Wave speed is frequency times wavelength: v = fλ = (5 Hz)(2 m) = 10 m/s."]}},{"id":"concept-7-2","title":"Sound","section":"7.2","asset":"ph07-02","steps":[{"text":"Sound in air is a longitudinal pressure wave. Air parcels oscillate about equilibrium while the disturbance transports energy through the medium.","focus":["part-0"]},{"text":"Sound speed depends on the medium and conditions. Frequency is set by the source; crossing into a different stationary medium generally changes speed and wavelength while preserving frequency.","focus":["part-1"]},{"text":"Sound intensity level is β = 10 log10(I/I0) in decibels. A 10 dB increase means ten times the intensity, not ten times the pressure amplitude.","focus":["part-2"]},{"text":"For an approaching source and observer, the classical Doppler effect generally raises observed frequency. Use a stated sign convention and distinguish source speed from wave speed in the medium.","focus":["part-3"]}],"coreRule":{"title":"7.2 · Sound: the governing relation","paragraphs":["Sound in air is a longitudinal pressure wave. Air parcels oscillate about equilibrium while the disturbance transports energy through the medium.","Sound speed depends on the medium and conditions. Frequency is set by the source; crossing into a different stationary medium generally changes speed and wavelength while preserving frequency."]},"memoryCue":{"title":"7.2 · Particles oscillate; the pressure pattern travels.","paragraphs":["Particles oscillate; the pressure pattern travels.","Sound speed depends on the medium and conditions. Frequency is set by the source; crossing into a different stationary medium generally changes speed and wavelength while preserving frequency."]},"traps":{"title":"7.2 · Check signs, assumptions and meaning","paragraphs":["Sound intensity level is β = 10 log10(I/I0) in decibels. A 10 dB increase means ten times the intensity, not ten times the pressure amplitude.","For an approaching source and observer, the classical Doppler effect generally raises observed frequency. Use a stated sign convention and distinguish source speed from wave speed in the medium."]},"application":{"title":"7.2 · Apply the model within its limits","paragraphs":["For an approaching source and observer, the classical Doppler effect generally raises observed frequency. Use a stated sign convention and distinguish source speed from wave speed in the medium.","Wavelength is speed divided by frequency: λ = v/f = 340/170 = 2 m."]}}],"exercises":[{"id":"ph-07-01-workshop-v1","title":"General Wave Characteristics","asset":"ph07-01","stages":[{"id":"map","type":"selection","prompt":"Select the spatial separation between neighboring crests.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Wavelength. A periodic wave is described by amplitude, wavelength, frequency and period. Frequency is inverse period, and wave speed is v = fλ for the specified wave and medium.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Amplitude measures disturbance size, not the distance between successive crests. Wavelength is a spatial period, while ordinary period is a time interval."]},{"type":"number","prompt":"A wave has frequency 5 Hz and wavelength 2 m. Find its speed.","answer":10,"unit":"m/s","tolerance":0,"explanation":"Wave speed is frequency times wavelength: v = fλ = (5 Hz)(2 m) = 10 m/s.","id":"reason","hints":["A periodic wave is described by amplitude, wavelength, frequency and period. Frequency is inverse period, and wave speed is v = fλ for the specified wave and medium.","Amplitude measures disturbance size, not the distance between successive crests. Wavelength is a spatial period, while ordinary period is a time interval."]},{"type":"number","prompt":"Find the period of a 4 Hz wave.","answer":0.25,"unit":"s","tolerance":0,"explanation":"Period is inverse frequency, so T = 1/f = 1/(4 Hz) = 0.25 s.","id":"transfer","hints":["Amplitude measures disturbance size, not the distance between successive crests. Wavelength is a spatial period, while ordinary period is a time interval.","Superposition adds displacements when the medium behaves linearly. Interference can enhance or cancel the local disturbance without implying that all energy has disappeared."]}]},{"id":"ph-07-02-workshop-v1","title":"Sound","asset":"ph07-02","stages":[{"id":"map","type":"selection","prompt":"Select the high-pressure region of a longitudinal sound wave.","answer":["part-0"],"explanation":"The relevant diagram entity or entities are Compression. Sound in air is a longitudinal pressure wave. Air parcels oscillate about equilibrium while the disturbance transports energy through the medium.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Sound speed depends on the medium and conditions. Frequency is set by the source; crossing into a different stationary medium generally changes speed and wavelength while preserving frequency."]},{"type":"number","prompt":"Sound travels at 340 m/s with frequency 170 Hz. Find wavelength.","answer":2,"unit":"m","tolerance":0,"explanation":"Wavelength is speed divided by frequency: λ = v/f = 340/170 = 2 m.","id":"reason","hints":["Sound in air is a longitudinal pressure wave. Air parcels oscillate about equilibrium while the disturbance transports energy through the medium.","Sound speed depends on the medium and conditions. Frequency is set by the source; crossing into a different stationary medium generally changes speed and wavelength while preserving frequency."]},{"type":"number","prompt":"If sound intensity rises by a factor of 100, find the increase in intensity level.","answer":20,"unit":"dB","tolerance":0,"explanation":"Δβ = 10 log10(100) = 20 dB.","id":"transfer","hints":["Sound speed depends on the medium and conditions. Frequency is set by the source; crossing into a different stationary medium generally changes speed and wavelength while preserving frequency.","Sound intensity level is β = 10 log10(I/I0) in decibels. A 10 dB increase means ten times the intensity, not ten times the pressure amplitude."]}]}]},{"version":1,"id":"chapter-08","title":"Light and Optics","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-8-1","title":"Electromagnetic Spectrum","section":"8.1","asset":"ph08-01","steps":[{"text":"Electromagnetic waves in vacuum travel at c and obey c = fλ. The spectrum orders radio, microwave, infrared, visible, ultraviolet, X-ray and gamma-ray regions by increasing typical frequency.","focus":["part-0"]},{"text":"A photon has energy E = hf = hc/λ. Greater frequency means greater energy per photon; greater intensity can instead mean more photons arriving per time and area.","focus":["part-1"]},{"text":"In a material, phase speed and wavelength can change while the frequency from a steady source remains fixed at a stationary boundary. The vacuum c relation does not use the material wavelength unchanged.","focus":["part-2"]},{"text":"Spectrum bands are useful categories rather than perfectly universal origin-free boundaries. A wave’s speed in vacuum does not increase because its frequency is higher.","focus":["part-3"]}],"coreRule":{"title":"8.1 · Electromagnetic Spectrum: the governing relation","paragraphs":["Electromagnetic waves in vacuum travel at c and obey c = fλ. The spectrum orders radio, microwave, infrared, visible, ultraviolet, X-ray and gamma-ray regions by increasing typical frequency.","A photon has energy E = hf = hc/λ. Greater frequency means greater energy per photon; greater intensity can instead mean more photons arriving per time and area."]},"memoryCue":{"title":"8.1 · In vacuum: higher frequency, shorter wavelength, larger photon energy.","paragraphs":["In vacuum: higher frequency, shorter wavelength, larger photon energy.","A photon has energy E = hf = hc/λ. Greater frequency means greater energy per photon; greater intensity can instead mean more photons arriving per time and area."]},"traps":{"title":"8.1 · Check signs, assumptions and meaning","paragraphs":["In a material, phase speed and wavelength can change while the frequency from a steady source remains fixed at a stationary boundary. The vacuum c relation does not use the material wavelength unchanged.","Spectrum bands are useful categories rather than perfectly universal origin-free boundaries. A wave’s speed in vacuum does not increase because its frequency is higher."]},"application":{"title":"8.1 · Apply the model within its limits","paragraphs":["Spectrum bands are useful categories rather than perfectly universal origin-free boundaries. A wave’s speed in vacuum does not increase because its frequency is higher.","f = c/λ = (3.0×10⁸)/(6.0×10⁻⁷) = 5.0×10¹⁴ Hz."]}},{"id":"concept-8-2","title":"Geometrical Optics","section":"8.2","asset":"ph08-02","steps":[{"text":"In the thin-lens model, 1/f = 1/do + 1/di. Use a consistent sign convention: a converging lens has positive f, a real object has positive do, and a real image has positive di.","focus":["part-0"]},{"text":"Transverse magnification is m = -di/do in this convention. Negative m means an inverted image; positive m means an upright image.","focus":["part-1"]},{"text":"Snell’s law uses n1 sin θ1 = n2 sin θ2 with angles measured from the normal. Total internal reflection requires travel from higher n to lower n and an angle beyond the critical value.","focus":["part-2"]},{"text":"A ray sketch constrains image location and orientation. Thin-lens equations require the stated approximation and do not model every thick lens or aberration.","focus":["part-3"]}],"coreRule":{"title":"8.2 · Geometrical Optics: the governing relation","paragraphs":["In the thin-lens model, 1/f = 1/do + 1/di. Use a consistent sign convention: a converging lens has positive f, a real object has positive do, and a real image has positive di.","Transverse magnification is m = -di/do in this convention. Negative m means an inverted image; positive m means an upright image."]},"memoryCue":{"title":"8.2 · Choose signs first; measure refraction angles from the normal.","paragraphs":["Choose signs first; measure refraction angles from the normal.","Transverse magnification is m = -di/do in this convention. Negative m means an inverted image; positive m means an upright image."]},"traps":{"title":"8.2 · Check signs, assumptions and meaning","paragraphs":["Snell’s law uses n1 sin θ1 = n2 sin θ2 with angles measured from the normal. Total internal reflection requires travel from higher n to lower n and an angle beyond the critical value.","A ray sketch constrains image location and orientation. Thin-lens equations require the stated approximation and do not model every thick lens or aberration."]},"application":{"title":"8.2 · Apply the model within its limits","paragraphs":["A ray sketch constrains image location and orientation. Thin-lens equations require the stated approximation and do not model every thick lens or aberration.","1/di = 1/10 - 1/30 = 1/15 cm⁻¹, so di = +15 cm, a real image."]}},{"id":"concept-8-3","title":"Diffraction","section":"8.3","asset":"ph08-03","steps":[{"text":"Diffraction spreads waves passing through openings or around edges. It becomes prominent when the opening size is comparable to wavelength.","focus":["part-0"]},{"text":"For a single slit of width a, minima satisfy a sin θ = mλ for nonzero integers m. A narrower slit gives a broader central maximum for a fixed wavelength.","focus":["part-1"]},{"text":"Two-slit interference and single-slit diffraction have different formulas and meanings. Do not call a single-slit minimum a two-slit bright fringe.","focus":["part-2"]},{"text":"The small-angle approximation sin θ ≈ tan θ ≈ y/L uses angles in radians and requires a suitable geometry. Real patterns can combine interference with a diffraction envelope.","focus":["part-3"]}],"coreRule":{"title":"8.3 · Diffraction: the governing relation","paragraphs":["Diffraction spreads waves passing through openings or around edges. It becomes prominent when the opening size is comparable to wavelength.","For a single slit of width a, minima satisfy a sin θ = mλ for nonzero integers m. A narrower slit gives a broader central maximum for a fixed wavelength."]},"memoryCue":{"title":"8.3 · A narrower opening spreads the central pattern wider.","paragraphs":["A narrower opening spreads the central pattern wider.","For a single slit of width a, minima satisfy a sin θ = mλ for nonzero integers m. A narrower slit gives a broader central maximum for a fixed wavelength."]},"traps":{"title":"8.3 · Check signs, assumptions and meaning","paragraphs":["Two-slit interference and single-slit diffraction have different formulas and meanings. Do not call a single-slit minimum a two-slit bright fringe.","The small-angle approximation sin θ ≈ tan θ ≈ y/L uses angles in radians and requires a suitable geometry. Real patterns can combine interference with a diffraction envelope."]},"application":{"title":"8.3 · Apply the model within its limits","paragraphs":["The small-angle approximation sin θ ≈ tan θ ≈ y/L uses angles in radians and requires a suitable geometry. Real patterns can combine interference with a diffraction envelope.","For m = 1, sin θ = λ/a = 0.25."]}},{"id":"concept-8-4","title":"Polarization","section":"8.4","asset":"ph08-04","steps":[{"text":"Polarization specifies the orientation pattern of an electromagnetic wave’s electric field. Longitudinal sound in air does not have the same transverse polarization freedom.","focus":["part-0"]},{"text":"An ideal polarizer transmits half the intensity of unpolarized incident light. For already linearly polarized light, Malus’s law gives I = I0 cos² θ relative to the transmission axis.","focus":["part-1"]},{"text":"Two ideal crossed polarizers transmit zero of an initially transmitted linear polarization. Adding an intermediate polarizer can change that result by changing the transmitted polarization direction.","focus":["part-2"]},{"text":"Intensity is not electric-field amplitude: intensity is proportional to amplitude squared in a fixed medium. A one-half amplitude ratio gives a one-quarter intensity ratio.","focus":["part-3"]}],"coreRule":{"title":"8.4 · Polarization: the governing relation","paragraphs":["Polarization specifies the orientation pattern of an electromagnetic wave’s electric field. Longitudinal sound in air does not have the same transverse polarization freedom.","An ideal polarizer transmits half the intensity of unpolarized incident light. For already linearly polarized light, Malus’s law gives I = I0 cos² θ relative to the transmission axis."]},"memoryCue":{"title":"8.4 · Unpolarized first pass: half; aligned linear pass: cosine squared.","paragraphs":["Unpolarized first pass: half; aligned linear pass: cosine squared.","An ideal polarizer transmits half the intensity of unpolarized incident light. For already linearly polarized light, Malus’s law gives I = I0 cos² θ relative to the transmission axis."]},"traps":{"title":"8.4 · Check signs, assumptions and meaning","paragraphs":["Two ideal crossed polarizers transmit zero of an initially transmitted linear polarization. Adding an intermediate polarizer can change that result by changing the transmitted polarization direction.","Intensity is not electric-field amplitude: intensity is proportional to amplitude squared in a fixed medium. A one-half amplitude ratio gives a one-quarter intensity ratio."]},"application":{"title":"8.4 · Apply the model within its limits","paragraphs":["Intensity is not electric-field amplitude: intensity is proportional to amplitude squared in a fixed medium. A one-half amplitude ratio gives a one-quarter intensity ratio.","An ideal polarizer transmits half of unpolarized intensity: 80/2 = 40 W/m²."]}}],"exercises":[{"id":"ph-08-01-workshop-v1","title":"Electromagnetic Spectrum","asset":"ph08-01","stages":[{"id":"map","type":"selection","prompt":"Select the direction corresponding to shorter vacuum wavelength.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Increasing frequency. Electromagnetic waves in vacuum travel at c and obey c = fλ. The spectrum orders radio, microwave, infrared, visible, ultraviolet, X-ray and gamma-ray regions by increasing typical frequency.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A photon has energy E = hf = hc/λ. Greater frequency means greater energy per photon; greater intensity can instead mean more photons arriving per time and area."]},{"type":"number","prompt":"Using c = 3.0×10⁸ m/s, find the vacuum frequency of light with wavelength 6.0×10⁻⁷ m.","answer":500000000000000,"unit":"Hz","tolerance":0,"explanation":"f = c/λ = (3.0×10⁸)/(6.0×10⁻⁷) = 5.0×10¹⁴ Hz.","id":"reason","hints":["Electromagnetic waves in vacuum travel at c and obey c = fλ. The spectrum orders radio, microwave, infrared, visible, ultraviolet, X-ray and gamma-ray regions by increasing typical frequency.","A photon has energy E = hf = hc/λ. Greater frequency means greater energy per photon; greater intensity can instead mean more photons arriving per time and area."]},{"type":"choice","prompt":"Compared with a red photon, a blue photon in vacuum generally has what property?","options":["Lower energy and longer wavelength","Greater vacuum speed","Greater energy and shorter wavelength","The same frequency necessarily"],"answer":2,"explanation":"E = hf and c = fλ: greater visible frequency gives higher photon energy and shorter wavelength, with the same c.","id":"transfer","hints":["A photon has energy E = hf = hc/λ. Greater frequency means greater energy per photon; greater intensity can instead mean more photons arriving per time and area.","In a material, phase speed and wavelength can change while the frequency from a steady source remains fixed at a stationary boundary. The vacuum c relation does not use the material wavelength unchanged."]}]},{"id":"ph-08-02-workshop-v1","title":"Geometrical Optics","asset":"ph08-02","stages":[{"id":"map","type":"selection","prompt":"Select the point at which paraxial rays parallel to the axis converge after an ideal converging lens.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Focal point. In the thin-lens model, 1/f = 1/do + 1/di. Use a consistent sign convention: a converging lens has positive f, a real object has positive do, and a real image has positive di.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Transverse magnification is m = -di/do in this convention. Negative m means an inverted image; positive m means an upright image."]},{"type":"number","prompt":"A thin converging lens has f = +10 cm and real object distance do = +30 cm. Find di.","answer":15,"unit":"cm","tolerance":0,"explanation":"1/di = 1/10 - 1/30 = 1/15 cm⁻¹, so di = +15 cm, a real image.","id":"reason","hints":["In the thin-lens model, 1/f = 1/do + 1/di. Use a consistent sign convention: a converging lens has positive f, a real object has positive do, and a real image has positive di.","Transverse magnification is m = -di/do in this convention. Negative m means an inverted image; positive m means an upright image."]},{"type":"number","prompt":"Using di = +15 cm and do = +30 cm, find signed magnification.","answer":-0.5,"unit":"dimensionless","tolerance":0,"explanation":"m = -di/do = -15/30 = -0.5, so the image is inverted and half-size.","id":"transfer","hints":["Transverse magnification is m = -di/do in this convention. Negative m means an inverted image; positive m means an upright image.","Snell’s law uses n1 sin θ1 = n2 sin θ2 with angles measured from the normal. Total internal reflection requires travel from higher n to lower n and an angle beyond the critical value."]}]},{"id":"ph-08-03-workshop-v1","title":"Diffraction","asset":"ph08-03","stages":[{"id":"map","type":"selection","prompt":"Select the physical opening whose width enters the single-slit relation.","answer":["part-0"],"explanation":"The relevant diagram entity or entities are Slit opening. Diffraction spreads waves passing through openings or around edges. It becomes prominent when the opening size is comparable to wavelength.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","For a single slit of width a, minima satisfy a sin θ = mλ for nonzero integers m. A narrower slit gives a broader central maximum for a fixed wavelength."]},{"type":"number","prompt":"For a single slit a = 2.0×10⁻⁶ m and wavelength 5.0×10⁻⁷ m, find sin θ for the first minimum.","answer":0.25,"unit":"dimensionless","tolerance":0,"explanation":"For m = 1, sin θ = λ/a = 0.25.","id":"reason","hints":["Diffraction spreads waves passing through openings or around edges. It becomes prominent when the opening size is comparable to wavelength.","For a single slit of width a, minima satisfy a sin θ = mλ for nonzero integers m. A narrower slit gives a broader central maximum for a fixed wavelength."]},{"type":"choice","prompt":"At fixed wavelength, what happens to a single-slit central maximum when slit width decreases?","options":["It broadens","It always narrows","It disappears because wavelength changes","It becomes a point for every width"],"answer":0,"explanation":"The first-minimum angle grows because sin θ = λ/a increases.","id":"transfer","hints":["For a single slit of width a, minima satisfy a sin θ = mλ for nonzero integers m. A narrower slit gives a broader central maximum for a fixed wavelength.","Two-slit interference and single-slit diffraction have different formulas and meanings. Do not call a single-slit minimum a two-slit bright fringe."]}]},{"id":"ph-08-04-workshop-v1","title":"Polarization","asset":"ph08-04","stages":[{"id":"map","type":"selection","prompt":"Select the outgoing quantity whose intensity follows the stated polarization laws.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Transmitted light. Polarization specifies the orientation pattern of an electromagnetic wave’s electric field. Longitudinal sound in air does not have the same transverse polarization freedom.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","An ideal polarizer transmits half the intensity of unpolarized incident light. For already linearly polarized light, Malus’s law gives I = I0 cos² θ relative to the transmission axis."]},{"type":"number","prompt":"Unpolarized light of intensity 80 W/m² reaches an ideal polarizer. Find transmitted intensity.","answer":40,"unit":"W/m²","tolerance":0,"explanation":"An ideal polarizer transmits half of unpolarized intensity: 80/2 = 40 W/m².","id":"reason","hints":["Polarization specifies the orientation pattern of an electromagnetic wave’s electric field. Longitudinal sound in air does not have the same transverse polarization freedom.","An ideal polarizer transmits half the intensity of unpolarized incident light. For already linearly polarized light, Malus’s law gives I = I0 cos² θ relative to the transmission axis."]},{"type":"number","prompt":"Linearly polarized light of intensity 80 W/m² meets an ideal analyzer at 60°. Find transmitted intensity.","answer":20,"unit":"W/m²","tolerance":0,"explanation":"I = I0 cos²60° = 80 × (1/2)² = 20 W/m².","id":"transfer","hints":["An ideal polarizer transmits half the intensity of unpolarized incident light. For already linearly polarized light, Malus’s law gives I = I0 cos² θ relative to the transmission axis.","Two ideal crossed polarizers transmit zero of an initially transmitted linear polarization. Adding an intermediate polarizer can change that result by changing the transmitted polarization direction."]}]}]},{"version":1,"id":"chapter-09","title":"Atomic and Nuclear Phenomena","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-9-1","title":"The Photoelectric Effect","section":"9.1","asset":"ph09-01","steps":[{"text":"Photoelectric emission occurs when photon energy can overcome the material’s work function. The ideal maximum electron kinetic energy is Kmax = hf - φ for frequencies above threshold.","focus":["part-0"]},{"text":"At fixed above-threshold frequency, increasing intensity mainly increases the number of emitted electrons per time rather than their maximum kinetic energy.","focus":["part-1"]},{"text":"Below threshold, increasing ordinary single-photon light intensity does not produce emission in this elementary model. Multiphoton regimes require additional assumptions and are outside this model.","focus":["part-2"]},{"text":"Stopping-potential magnitude satisfies eVs = Kmax. Distinguish energy in electronvolts from voltage in volts and photon arrival rate from energy per photon.","focus":["part-3"]}],"coreRule":{"title":"9.1 · The Photoelectric Effect: the governing relation","paragraphs":["Photoelectric emission occurs when photon energy can overcome the material’s work function. The ideal maximum electron kinetic energy is Kmax = hf - φ for frequencies above threshold.","At fixed above-threshold frequency, increasing intensity mainly increases the number of emitted electrons per time rather than their maximum kinetic energy."]},"memoryCue":{"title":"9.1 · Frequency sets each photon’s energy; intensity sets the photon count rate.","paragraphs":["Frequency sets each photon’s energy; intensity sets the photon count rate.","At fixed above-threshold frequency, increasing intensity mainly increases the number of emitted electrons per time rather than their maximum kinetic energy."]},"traps":{"title":"9.1 · Check signs, assumptions and meaning","paragraphs":["Below threshold, increasing ordinary single-photon light intensity does not produce emission in this elementary model. Multiphoton regimes require additional assumptions and are outside this model.","Stopping-potential magnitude satisfies eVs = Kmax. Distinguish energy in electronvolts from voltage in volts and photon arrival rate from energy per photon."]},"application":{"title":"9.1 · Apply the model within its limits","paragraphs":["Stopping-potential magnitude satisfies eVs = Kmax. Distinguish energy in electronvolts from voltage in volts and photon arrival rate from energy per photon.","Kmax = Ephoton - φ = 5 - 2 = 3 eV."]}},{"id":"concept-9-2","title":"Absorption and Emission of Light","section":"9.2","asset":"ph09-02","steps":[{"text":"An atom absorbs a photon when the photon energy matches an allowed energy gap. A transition to a higher state increases the atom’s internal energy.","focus":["part-0"]},{"text":"Emission occurs when a system loses energy to a photon with E = ΔE = hf. Discrete energy levels produce characteristic spectral lines rather than every possible photon energy.","focus":["part-1"]},{"text":"Not every pair of levels has an equally allowed transition. Selection rules and transition probabilities matter; a level diagram alone does not determine relative line intensities.","focus":["part-2"]},{"text":"A larger positive energy gap corresponds to a higher-frequency, shorter-wavelength emitted photon. The energy zero for the level diagram does not alter a transition gap.","focus":["part-3"]}],"coreRule":{"title":"9.2 · Absorption and Emission of Light: the governing relation","paragraphs":["An atom absorbs a photon when the photon energy matches an allowed energy gap. A transition to a higher state increases the atom’s internal energy.","Emission occurs when a system loses energy to a photon with E = ΔE = hf. Discrete energy levels produce characteristic spectral lines rather than every possible photon energy."]},"memoryCue":{"title":"9.2 · Photons match differences between levels, not the level labels themselves.","paragraphs":["Photons match differences between levels, not the level labels themselves.","Emission occurs when a system loses energy to a photon with E = ΔE = hf. Discrete energy levels produce characteristic spectral lines rather than every possible photon energy."]},"traps":{"title":"9.2 · Check signs, assumptions and meaning","paragraphs":["Not every pair of levels has an equally allowed transition. Selection rules and transition probabilities matter; a level diagram alone does not determine relative line intensities.","A larger positive energy gap corresponds to a higher-frequency, shorter-wavelength emitted photon. The energy zero for the level diagram does not alter a transition gap."]},"application":{"title":"9.2 · Apply the model within its limits","paragraphs":["A larger positive energy gap corresponds to a higher-frequency, shorter-wavelength emitted photon. The energy zero for the level diagram does not alter a transition gap.","The atom loses 7 - 2 = 5 eV, which becomes the photon energy for this transition."]}},{"id":"concept-9-3","title":"Nuclear Binding Energy and Mass Defect","section":"9.3","asset":"ph09-03","steps":[{"text":"A bound nucleus has lower mass than its separated constituent protons and neutrons. The mass defect corresponds to binding energy through E = Δmc².","focus":["part-0"]},{"text":"Binding energy is the energy required to separate the nucleus into free nucleons. Energy released during formation is the same magnitude for the reverse ideal comparison.","focus":["part-1"]},{"text":"Compare nuclear masses with nuclear constituent masses, or atomic masses with a consistent electron accounting. Mixing conventions can produce a spurious mass defect.","focus":["part-2"]},{"text":"Binding energy per nucleon helps compare nuclear stability trends but is not by itself a complete reaction-rate or decay-mode predictor.","focus":["part-3"]}],"coreRule":{"title":"9.3 · Nuclear Binding Energy and Mass Defect: the governing relation","paragraphs":["A bound nucleus has lower mass than its separated constituent protons and neutrons. The mass defect corresponds to binding energy through E = Δmc².","Binding energy is the energy required to separate the nucleus into free nucleons. Energy released during formation is the same magnitude for the reverse ideal comparison."]},"memoryCue":{"title":"9.3 · The missing mass records energy released on binding.","paragraphs":["The missing mass records energy released on binding.","Binding energy is the energy required to separate the nucleus into free nucleons. Energy released during formation is the same magnitude for the reverse ideal comparison."]},"traps":{"title":"9.3 · Check signs, assumptions and meaning","paragraphs":["Compare nuclear masses with nuclear constituent masses, or atomic masses with a consistent electron accounting. Mixing conventions can produce a spurious mass defect.","Binding energy per nucleon helps compare nuclear stability trends but is not by itself a complete reaction-rate or decay-mode predictor."]},"application":{"title":"9.3 · Apply the model within its limits","paragraphs":["Binding energy per nucleon helps compare nuclear stability trends but is not by itself a complete reaction-rate or decay-mode predictor.","E = 0.020 × 931.5 = 18.63 MeV."]}},{"id":"concept-9-4","title":"Nuclear Reactions","section":"9.4","asset":"ph09-04","steps":[{"text":"Nuclear equations conserve charge and nucleon number with emitted particles accounted for. Alpha decay lowers mass number by four and atomic number by two.","focus":["part-0"]},{"text":"In beta-minus decay, a neutron converts to a proton while an electron and an antineutrino are emitted. Nuclear mass number stays fixed and atomic number increases by one.","focus":["part-1"]},{"text":"For a single exponential decay population, N = N0(1/2)^(t/t½). A half-life concerns a population probability, not a scheduled lifetime for each nucleus.","focus":["part-2"]},{"text":"Activity is λN and has units decays per second. Fusion and fission can release energy when products have a lower total mass; reaction feasibility and rate also require the stated conditions.","focus":["part-3"]}],"coreRule":{"title":"9.4 · Nuclear Reactions: the governing relation","paragraphs":["Nuclear equations conserve charge and nucleon number with emitted particles accounted for. Alpha decay lowers mass number by four and atomic number by two.","In beta-minus decay, a neutron converts to a proton while an electron and an antineutrino are emitted. Nuclear mass number stays fixed and atomic number increases by one."]},"memoryCue":{"title":"9.4 · Balance charge and nucleon count before naming the daughter.","paragraphs":["Balance charge and nucleon count before naming the daughter.","In beta-minus decay, a neutron converts to a proton while an electron and an antineutrino are emitted. Nuclear mass number stays fixed and atomic number increases by one."]},"traps":{"title":"9.4 · Check signs, assumptions and meaning","paragraphs":["For a single exponential decay population, N = N0(1/2)^(t/t½). A half-life concerns a population probability, not a scheduled lifetime for each nucleus.","Activity is λN and has units decays per second. Fusion and fission can release energy when products have a lower total mass; reaction feasibility and rate also require the stated conditions."]},"application":{"title":"9.4 · Apply the model within its limits","paragraphs":["Activity is λN and has units decays per second. Fusion and fission can release energy when products have a lower total mass; reaction feasibility and rate also require the stated conditions.","N = 800 × (1/2)³ = 100 expected undecayed nuclei."]}}],"exercises":[{"id":"ph-09-01-workshop-v1","title":"The Photoelectric Effect","asset":"ph09-01","stages":[{"id":"map","type":"selection","prompt":"Select the minimum-energy condition needed for emission in the model.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Threshold. Photoelectric emission occurs when photon energy can overcome the material’s work function. The ideal maximum electron kinetic energy is Kmax = hf - φ for frequencies above threshold.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","At fixed above-threshold frequency, increasing intensity mainly increases the number of emitted electrons per time rather than their maximum kinetic energy."]},{"type":"number","prompt":"A metal has work function 2 eV and receives 5 eV photons in the single-photon model. Find Kmax.","answer":3,"unit":"eV","tolerance":0,"explanation":"Kmax = Ephoton - φ = 5 - 2 = 3 eV.","id":"reason","hints":["Photoelectric emission occurs when photon energy can overcome the material’s work function. The ideal maximum electron kinetic energy is Kmax = hf - φ for frequencies above threshold.","At fixed above-threshold frequency, increasing intensity mainly increases the number of emitted electrons per time rather than their maximum kinetic energy."]},{"type":"choice","prompt":"At fixed frequency above threshold, brighter light most directly changes what?","options":["The work function necessarily","The maximum kinetic energy by the intensity factor","The photon energy necessarily","The emission rate"],"answer":3,"explanation":"More incident photons can eject more electrons per time while the energy per photon remains hf.","id":"transfer","hints":["At fixed above-threshold frequency, increasing intensity mainly increases the number of emitted electrons per time rather than their maximum kinetic energy.","Below threshold, increasing ordinary single-photon light intensity does not produce emission in this elementary model. Multiphoton regimes require additional assumptions and are outside this model."]}]},{"id":"ph-09-02-workshop-v1","title":"Absorption and Emission of Light","asset":"ph09-02","stages":[{"id":"map","type":"selection","prompt":"Select the process in which the atom gives energy to a photon.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Emission. An atom absorbs a photon when the photon energy matches an allowed energy gap. A transition to a higher state increases the atom’s internal energy.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Emission occurs when a system loses energy to a photon with E = ΔE = hf. Discrete energy levels produce characteristic spectral lines rather than every possible photon energy."]},{"type":"number","prompt":"An atom falls from 7 eV to 2 eV. Find emitted photon energy.","answer":5,"unit":"eV","tolerance":0,"explanation":"The atom loses 7 - 2 = 5 eV, which becomes the photon energy for this transition.","id":"reason","hints":["An atom absorbs a photon when the photon energy matches an allowed energy gap. A transition to a higher state increases the atom’s internal energy.","Emission occurs when a system loses energy to a photon with E = ΔE = hf. Discrete energy levels produce characteristic spectral lines rather than every possible photon energy."]},{"type":"choice","prompt":"Which transition emits a higher-frequency photon?","options":["The one with the larger energy gap","The one starting at the numerically lower level in every diagram","Every gap gives the same frequency","The transition with more atoms but equal gap"],"answer":0,"explanation":"E = hf relates photon frequency to the transition energy gap, not the number of emitters.","id":"transfer","hints":["Emission occurs when a system loses energy to a photon with E = ΔE = hf. Discrete energy levels produce characteristic spectral lines rather than every possible photon energy.","Not every pair of levels has an equally allowed transition. Selection rules and transition probabilities matter; a level diagram alone does not determine relative line intensities."]}]},{"id":"ph-09-03-workshop-v1","title":"Nuclear Binding Energy and Mass Defect","asset":"ph09-03","stages":[{"id":"map","type":"selection","prompt":"Select the quantity converted to energy by multiplying by c².","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Mass difference. A bound nucleus has lower mass than its separated constituent protons and neutrons. The mass defect corresponds to binding energy through E = Δmc².","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Binding energy is the energy required to separate the nucleus into free nucleons. Energy released during formation is the same magnitude for the reverse ideal comparison."]},{"type":"number","prompt":"Using 1 u·c² = 931.5 MeV, find binding energy for mass defect 0.020 u.","answer":18.63,"unit":"MeV","tolerance":0.000001,"explanation":"E = 0.020 × 931.5 = 18.63 MeV.","id":"reason","hints":["A bound nucleus has lower mass than its separated constituent protons and neutrons. The mass defect corresponds to binding energy through E = Δmc².","Binding energy is the energy required to separate the nucleus into free nucleons. Energy released during formation is the same magnitude for the reverse ideal comparison."]},{"type":"choice","prompt":"What mass comparison is consistent for a nuclear binding-energy calculation?","options":["Mix an atomic mass with bare protons and ignore electrons","Use nuclear masses with proton and neutron nuclear masses","Use volume difference alone","Assume all nuclei have equal mass per nucleon"],"answer":1,"explanation":"The electron contribution must be included consistently if atomic rather than nuclear masses are used.","id":"transfer","hints":["Binding energy is the energy required to separate the nucleus into free nucleons. Energy released during formation is the same magnitude for the reverse ideal comparison.","Compare nuclear masses with nuclear constituent masses, or atomic masses with a consistent electron accounting. Mixing conventions can produce a spurious mass defect."]}]},{"id":"ph-09-04-workshop-v1","title":"Nuclear Reactions","asset":"ph09-04","stages":[{"id":"map","type":"selection","prompt":"Select the population timescale over which expected undecayed count halves.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Half-life. Nuclear equations conserve charge and nucleon number with emitted particles accounted for. Alpha decay lowers mass number by four and atomic number by two.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","In beta-minus decay, a neutron converts to a proton while an electron and an antineutrino are emitted. Nuclear mass number stays fixed and atomic number increases by one."]},{"type":"number","prompt":"A single isotope starts with 800 undecayed nuclei in an ideal population model. How many are expected after three half-lives?","answer":100,"unit":"nuclei","tolerance":0,"explanation":"N = 800 × (1/2)³ = 100 expected undecayed nuclei.","id":"reason","hints":["Nuclear equations conserve charge and nucleon number with emitted particles accounted for. Alpha decay lowers mass number by four and atomic number by two.","In beta-minus decay, a neutron converts to a proton while an electron and an antineutrino are emitted. Nuclear mass number stays fixed and atomic number increases by one."]},{"type":"number","prompt":"An alpha decay starts from a nucleus with mass number 226. Find the daughter’s mass number.","answer":222,"unit":"dimensionless","tolerance":0,"explanation":"An alpha particle contains four nucleons, so Adaughter = 226 - 4 = 222.","id":"transfer","hints":["In beta-minus decay, a neutron converts to a proton while an electron and an antineutrino are emitted. Nuclear mass number stays fixed and atomic number increases by one.","For a single exponential decay population, N = N0(1/2)^(t/t½). A half-life concerns a population probability, not a scheduled lifetime for each nucleus."]}]}]},{"version":1,"id":"chapter-10","title":"Mathematics","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-10-1","title":"Arithmetic and Significant Figures","section":"10.1","asset":"ph10-01","steps":[{"text":"Reported precision should match the information available. Leading zeros locate a decimal point but do not count as significant digits; zeros between nonzero digits do count.","focus":["part-0"]},{"text":"For multiplication and division, a common reporting convention uses the fewest significant figures among measured inputs. For addition and subtraction, the limiting decimal place governs.","focus":["part-1"]},{"text":"Exact counts and defined conversion factors do not impose the same significant-figure limit as uncertain measurements. Keep extra digits during intermediate work to reduce rounding error.","focus":["part-2"]},{"text":"A final numerical value and its precision are different aspects of reporting. In this app, dedicated precision questions can require exact text while ordinary numerical questions assess value in a stated unit.","focus":["part-3"]}],"coreRule":{"title":"10.1 · Arithmetic and Significant Figures: the governing relation","paragraphs":["Reported precision should match the information available. Leading zeros locate a decimal point but do not count as significant digits; zeros between nonzero digits do count.","For multiplication and div
