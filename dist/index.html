ations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-1-1","title":"Units","section":"1.1","asset":"ph01-01","steps":[{"text":"SI units connect measurements to dimensions: kilograms for mass, meters for length and seconds for time. A number without its unit does not fully specify a physical measurement.","focus":["part-0"]},{"text":"Derived units combine base units. A newton is kg·m/s², a joule is N·m and a pascal is N/m². Dimensional agreement is a necessary check on an equation, not proof of its numerical coefficient.","focus":["part-1"]},{"text":"Convert with factors equal to one and cancel units explicitly. A squared length conversion squares the whole factor: one square centimeter is 10⁻⁴ square meters, not 10⁻².","focus":["part-2"]},{"text":"Keep mass distinct from weight, and prefix scales distinct from powers. Use dimensional analysis to reject a proposed result before spending time on arithmetic.","focus":["part-3"]}],"coreRule":{"title":"1.1 · Units: the governing relation","paragraphs":["SI units connect measurements to dimensions: kilograms for mass, meters for length and seconds for time. A number without its unit does not fully specify a physical measurement.","Derived units combine base units. A newton is kg·m/s², a joule is N·m and a pascal is N/m². Dimensional agreement is a necessary check on an equation, not proof of its numerical coefficient."]},"memoryCue":{"title":"1.1 · Convert first, then square the conversion factor.","paragraphs":["Convert first, then square the conversion factor.","Derived units combine base units. A newton is kg·m/s², a joule is N·m and a pascal is N/m². Dimensional agreement is a necessary check on an equation, not proof of its numerical coefficient."]},"traps":{"title":"1.1 · Check signs, assumptions and meaning","paragraphs":["Convert with factors equal to one and cancel units explicitly. A squared length conversion squares the whole factor: one square centimeter is 10⁻⁴ square meters, not 10⁻².","Keep mass distinct from weight, and prefix scales distinct from powers. Use dimensional analysis to reject a proposed result before spending time on arithmetic."]},"application":{"title":"1.1 · Apply the model within its limits","paragraphs":["Keep mass distinct from weight, and prefix scales distinct from powers. Use dimensional analysis to reject a proposed result before spending time on arithmetic.","250 cm × (1 m / 100 cm) = 2.5 m."]}},{"id":"concept-1-2","title":"Vectors and Scalars","section":"1.2","asset":"ph01-02","steps":[{"text":"A scalar has magnitude; a vector also has direction. Mass and energy are scalars, while displacement, velocity, acceleration and force are vectors.","focus":["part-0"]},{"text":"For a vector A at angle θ measured from positive x, Ax = A cos θ and Ay = A sin θ. Components carry signs determined by direction relative to the chosen axes.","focus":["part-1"]},{"text":"Add vectors by adding corresponding components. Magnitudes generally cannot be added directly unless the vectors point along the same direction.","focus":["part-2"]},{"text":"Perpendicular components of 3 and 4 units give a magnitude of 5 units by the Pythagorean theorem. A negative component is a direction statement, not a negative vector magnitude.","focus":["part-3"]}],"coreRule":{"title":"1.2 · Vectors and Scalars: the governing relation","paragraphs":["A scalar has magnitude; a vector also has direction. Mass and energy are scalars, while displacement, velocity, acceleration and force are vectors.","For a vector A at angle θ measured from positive x, Ax = A cos θ and Ay = A sin θ. Components carry signs determined by direction relative to the chosen axes."]},"memoryCue":{"title":"1.2 · Resolve, add components, then recover the magnitude.","paragraphs":["Resolve, add components, then recover the magnitude.","For a vector A at angle θ measured from positive x, Ax = A cos θ and Ay = A sin θ. Components carry signs determined by direction relative to the chosen axes."]},"traps":{"title":"1.2 · Check signs, assumptions and meaning","paragraphs":["Add vectors by adding corresponding components. Magnitudes generally cannot be added directly unless the vectors point along the same direction.","Perpendicular components of 3 and 4 units give a magnitude of 5 units by the Pythagorean theorem. A negative component is a direction statement, not a negative vector magnitude."]},"application":{"title":"1.2 · Apply the model within its limits","paragraphs":["Perpendicular components of 3 and 4 units give a magnitude of 5 units by the Pythagorean theorem. A negative component is a direction statement, not a negative vector magnitude.","Magnitude = sqrt(6² + 8²) m = 10 m."]}},{"id":"concept-1-3","title":"Displacement and Velocity","section":"1.3","asset":"ph01-03","steps":[{"text":"Displacement is final position minus initial position. Distance is total path length. Returning to a starting point gives zero displacement even when distance traveled is substantial.","focus":["part-0"]},{"text":"Average velocity is displacement divided by elapsed time; average speed is distance divided by elapsed time. Instantaneous velocity is the slope of a position-versus-time graph.","focus":["part-1"]},{"text":"A zero average velocity does not imply zero velocity at every instant. Keep the coordinate origin and positive direction explicit when interpreting a signed result.","focus":["part-2"]},{"text":"The area under a velocity-versus-time graph gives signed displacement. Sections below the time axis contribute negatively rather than adding to positive distance.","focus":["part-3"]}],"coreRule":{"title":"1.3 · Displacement and Velocity: the governing relation","paragraphs":["Displacement is final position minus initial position. Distance is total path length. Returning to a starting point gives zero displacement even when distance traveled is substantial.","Average velocity is displacement divided by elapsed time; average speed is distance divided by elapsed time. Instantaneous velocity is the slope of a position-versus-time graph."]},"memoryCue":{"title":"1.3 · Distance follows the route; displacement joins the endpoints.","paragraphs":["Distance follows the route; displacement joins the endpoints.","Average velocity is displacement divided by elapsed time; average speed is distance divided by elapsed time. Instantaneous velocity is the slope of a position-versus-time graph."]},"traps":{"title":"1.3 · Check signs, assumptions and meaning","paragraphs":["A zero average velocity does not imply zero velocity at every instant. Keep the coordinate origin and positive direction explicit when interpreting a signed result.","The area under a velocity-versus-time graph gives signed displacement. Sections below the time axis contribute negatively rather than adding to positive distance."]},"application":{"title":"1.3 · Apply the model within its limits","paragraphs":["The area under a velocity-versus-time graph gives signed displacement. Sections below the time axis contribute negatively rather than adding to positive distance.","Displacement is 10 - (-2) = 12 m; 12 m / 4 s = +3 m/s."]}},{"id":"concept-1-4","title":"Forces and Acceleration","section":"1.4","asset":"ph01-04","steps":[{"text":"Acceleration is the change in velocity per unit time. A change in direction is an acceleration even if speed remains constant.","focus":["part-0"]},{"text":"In an inertial frame, the net external force obeys ΣF = ma for a constant-mass object. Draw all forces on the chosen object and sum them as vectors.","focus":["part-1"]},{"text":"A force changes velocity, not necessarily motion in the force direction at that instant. An object moving right can accelerate left while slowing down.","focus":["part-2"]},{"text":"Kinetic friction is often modeled as μkN; static friction adjusts up to a maximum μsN. Do not set static friction equal to its maximum unless impending slip is specified.","focus":["part-3"]}],"coreRule":{"title":"1.4 · Forces and Acceleration: the governing relation","paragraphs":["Acceleration is the change in velocity per unit time. A change in direction is an acceleration even if speed remains constant.","In an inertial frame, the net external force obeys ΣF = ma for a constant-mass object. Draw all forces on the chosen object and sum them as vectors."]},"memoryCue":{"title":"1.4 · Net force sets acceleration; velocity can point elsewhere.","paragraphs":["Net force sets acceleration; velocity can point elsewhere.","In an inertial frame, the net external force obeys ΣF = ma for a constant-mass object. Draw all forces on the chosen object and sum them as vectors."]},"traps":{"title":"1.4 · Check signs, assumptions and meaning","paragraphs":["A force changes velocity, not necessarily motion in the force direction at that instant. An object moving right can accelerate left while slowing down.","Kinetic friction is often modeled as μkN; static friction adjusts up to a maximum μsN. Do not set static friction equal to its maximum unless impending slip is specified."]},"application":{"title":"1.4 · Apply the model within its limits","paragraphs":["Kinetic friction is often modeled as μkN; static friction adjusts up to a maximum μsN. Do not set static friction equal to its maximum unless impending slip is specified.","Using ΣFx = max gives ax = 12/3 = +4 m/s²."]}},{"id":"concept-1-5","title":"Newton’s Laws","section":"1.5","asset":"ph01-05","steps":[{"text":"Newton’s first law describes constant velocity when net force is zero in an inertial frame. Rest is only one possible constant-velocity state.","focus":["part-0"]},{"text":"Newton’s second law relates net force on one object to that object’s acceleration. More individual forces do not necessarily mean a larger net force.","focus":["part-1"]},{"text":"Third-law partners are equal and opposite forces acting on different objects. Weight and normal force on the same block are not a third-law pair.","focus":["part-2"]},{"text":"A contact force can change without changing gravitational weight. An accelerating elevator alters apparent weight, measured by the normal force, while mg stays approximately fixed.","focus":["part-3"]}],"coreRule":{"title":"1.5 · Newton’s Laws: the governing relation","paragraphs":["Newton’s first law describes constant velocity when net force is zero in an inertial frame. Rest is only one possible constant-velocity state.","Newton’s second law relates net force on one object to that object’s acceleration. More individual forces do not necessarily mean a larger net force."]},"memoryCue":{"title":"1.5 · Third-law partners live on different objects.","paragraphs":["Third-law partners live on different objects.","Newton’s second law relates net force on one object to that object’s acceleration. More individual forces do not necessarily mean a larger net force."]},"traps":{"title":"1.5 · Check signs, assumptions and meaning","paragraphs":["Third-law partners are equal and opposite forces acting on different objects. Weight and normal force on the same block are not a third-law pair.","A contact force can change without changing gravitational weight. An accelerating elevator alters apparent weight, measured by the normal force, while mg stays approximately fixed."]},"application":{"title":"1.5 · Apply the model within its limits","paragraphs":["A contact force can change without changing gravitational weight. An accelerating elevator alters apparent weight, measured by the normal force, while mg stays approximately fixed.","Weight magnitude is mg = 6 × 10 = 60 N."]}},{"id":"concept-1-6","title":"Motion with Constant Acceleration","section":"1.6","asset":"ph01-06","steps":[{"text":"For constant acceleration in one dimension, v = v0 + at and Δx = v0t + ½at². Choose signed values along one consistent axis.","focus":["part-0"]},{"text":"The relation v² = v0² + 2aΔx eliminates time. The mean of initial and final velocity equals average velocity only when acceleration is constant over the interval.","focus":["part-1"]},{"text":"Near Earth’s surface, free fall can be approximated with constant downward g when air resistance is negligible. At the top of a vertical toss, velocity is zero but acceleration is still downward.","focus":["part-2"]},{"text":"For projectile motion without drag, horizontal acceleration is zero while vertical acceleration is -g if up is positive. Components share the same flight time.","focus":["part-3"]}],"coreRule":{"title":"1.6 · Motion with Constant Acceleration: the governing relation","paragraphs":["For constant acceleration in one dimension, v = v0 + at and Δx = v0t + ½at². Choose signed values along one consistent axis.","The relation v² = v0² + 2aΔx eliminates time. The mean of initial and final velocity equals average velocity only when acceleration is constant over the interval."]},"memoryCue":{"title":"1.6 · Constant a permits the shortcut equations; check that assumption first.","paragraphs":["Constant a permits the shortcut equations; check that assumption first.","The relation v² = v0² + 2aΔx eliminates time. The mean of initial and final velocity equals average velocity only when acceleration is constant over the interval."]},"traps":{"title":"1.6 · Check signs, assumptions and meaning","paragraphs":["Near Earth’s surface, free fall can be approximated with constant downward g when air resistance is negligible. At the top of a vertical toss, velocity is zero but acceleration is still downward.","For projectile motion without drag, horizontal acceleration is zero while vertical acceleration is -g if up is positive. Components share the same flight time."]},"application":{"title":"1.6 · Apply the model within its limits","paragraphs":["For projectile motion without drag, horizontal acceleration is zero while vertical acceleration is -g if up is positive. Components share the same flight time.","Constant acceleration with zero initial velocity gives Δx = ½at² = ½(2)(3²) = +9 m."]}},{"id":"concept-1-7","title":"Mechanical Equilibrium","section":"1.7","asset":"ph01-07","steps":[{"text":"Translational equilibrium requires zero net force. Rotational equilibrium requires zero net torque about an axis; complete static equilibrium requires both.","focus":["part-0"]},{"text":"Torque magnitude is rF sin θ, or force times its perpendicular lever arm. A force applied through the pivot has zero torque about that pivot.","focus":["part-1"]},{"text":"Choose a rotation sign convention before summing torques. Equal force magnitudes can produce different torques when lever arms differ.","focus":["part-2"]},{"text":"A freely rotating ideal seesaw balances when clockwise and counterclockwise torques cancel. Equilibrium does not require every individual force or torque to vanish.","focus":["part-3"]}],"coreRule":{"title":"1.7 · Mechanical Equilibrium: the governing relation","paragraphs":["Translational equilibrium requires zero net force. Rotational equilibrium requires zero net torque about an axis; complete static equilibrium requires both.","Torque magnitude is rF sin θ, or force times its perpendicular lever arm. A force applied through the pivot has zero torque about that pivot."]},"memoryCue":{"title":"1.7 · Balance forces and torques separately.","paragraphs":["Balance forces and torques separately.","Torque magnitude is rF sin θ, or force times its perpendicular lever arm. A force applied through the pivot has zero torque about that pivot."]},"traps":{"title":"1.7 · Check signs, assumptions and meaning","paragraphs":["Choose a rotation sign convention before summing torques. Equal force magnitudes can produce different torques when lever arms differ.","A freely rotating ideal seesaw balances when clockwise and counterclockwise torques cancel. Equilibrium does not require every individual force or torque to vanish."]},"application":{"title":"1.7 · Apply the model within its limits","paragraphs":["A freely rotating ideal seesaw balances when clockwise and counterclockwise torques cancel. Equilibrium does not require every individual force or torque to vanish.","τ = rF = 0.5 × 12 = 6 N·m."]}}],"exercises":[{"id":"ph-01-01-workshop-v1","title":"Units","asset":"ph01-01","stages":[{"id":"map","type":"selection","prompt":"Select the category containing force, energy and pressure.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Derived quantity. SI units connect measurements to dimensions: kilograms for mass, meters for length and seconds for time. A number without its unit does not fully specify a physical measurement.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Derived units combine base units. A newton is kg·m/s², a joule is N·m and a pascal is N/m². Dimensional agreement is a necessary check on an equation, not proof of its numerical coefficient."]},{"type":"number","prompt":"Convert 250 cm to meters.","answer":2.5,"unit":"m","tolerance":0,"explanation":"250 cm × (1 m / 100 cm) = 2.5 m.","id":"reason","hints":["SI units connect measurements to dimensions: kilograms for mass, meters for length and seconds for time. A number without its unit does not fully specify a physical measurement.","Derived units combine base units. A newton is kg·m/s², a joule is N·m and a pascal is N/m². Dimensional agreement is a necessary check on an equation, not proof of its numerical coefficient."]},{"type":"number","prompt":"Convert 3 cm² to square meters.","answer":0.0003,"unit":"m²","tolerance":0,"explanation":"One centimeter is 0.01 m, so 3 cm² = 3 × (0.01)² m² = 0.0003 m².","id":"transfer","hints":["Derived units combine base units. A newton is kg·m/s², a joule is N·m and a pascal is N/m². Dimensional agreement is a necessary check on an equation, not proof of its numerical coefficient.","Convert with factors equal to one and cancel units explicitly. A squared length conversion squares the whole factor: one square centimeter ":[{"id":"map","type":"selection","prompt":"Select the quantity determined by the endpoints alone.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Displacement. Displacement is final position minus initial position. Distance is total path length. Returning to a starting point gives zero displacement even when distance traveled is substantial.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Average velocity is displacement divided by elapsed time; average speed is distance divided by elapsed time. Instantaneous velocity is the slope of a position-versus-time graph."]},{"type":"number","prompt":"A cart moves from x = -2 m to x = +10 m in 4 s. Find its average velocity.","answer":3,"unit":"m/s","tolerance":0,"explanation":"Displacement is 10 - (-2) = 12 m; 12 m / 4 s = +3 m/s.","id":"reason","hints":["Displacement is final position minus initial position. Distance is total path length. Returning to a starting point gives zero displacement even when distance traveled is substantial.","Average velocity is displacement divided by elapsed time; average speed is distance divided by elapsed time. Instantaneous velocity is the slope of a position-versus-time graph."]},{"type":"number","prompt":"A runner travels 30 m out and 30 m back in 20 s. Find average speed.","answer":3,"unit":"m/s","tolerance":0,"explanation":"Total distance is 60 m, so average speed is 60/20 = 3 m/s. Average velocity would be zero.","id":"transfer","hints":["Average velocity is displacement divided by elapsed time; average speed is distance divided by elapsed time. Instantaneous velocity is the slope of a position-versus-time graph.","A zero average velocity does not imply zero velocity at every instant. Keep the coordinate origin and positive direction explicit when interpreting a signed result."]}]},{"id":"ph-01-04-workshop-v1","title":"Forces and Acceleration","asset":"ph01-04","stages":[{"id":"map","type":"selection","prompt":"Select the force opposing relative sliding along the surface.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Friction. Acceleration is the change in velocity per unit time. A change in direction is an acceleration even if speed remains constant.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","In an inertial frame, the net external force obeys ΣF = ma for a constant-mass object. Draw all forces on the chosen object and sum them as vectors."]},{"type":"number","prompt":"A 3 kg block experiences a net horizontal force of +12 N. Find ax.","answer":4,"unit":"m/s²","tolerance":0,"explanation":"Using ΣFx = max gives ax = 12/3 = +4 m/s².","id":"reason","hints":["Acceleration is the change in velocity per unit time. A change in direction is an acceleration even if speed remains constant.","In an inertial frame, the net external force obeys ΣF = ma for a constant-mass object. Draw all forces on the chosen object and sum them as vectors."]},{"type":"choice","prompt":"A block moves right and slows down. What is the direction of its acceleration?","options":["Right","Up only","Left","Zero necessarily"],"answer":2,"explanation":"Slowing a rightward velocity requires a leftward acceleration.","id":"transfer","hints":["In an inertial frame, the net external force obeys ΣF = ma for a constant-mass object. Draw all forces on the chosen object and sum them as vectors.","A force changes velocity, not necessarily motion in the force direction at that instant. An object moving right can accelerate left while slowing down."]}]},{"id":"ph-01-05-workshop-v1","title":"Newton’s Laws","asset":"ph01-05","stages":[{"id":"map","type":"selection","prompt":"Select the contact force a scale measures as apparent weight.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Normal force. Newton’s first law describes constant velocity when net force is zero in an inertial frame. Rest is only one possible constant-velocity state.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Newton’s second law relates net force on one object to that object’s acceleration. More individual forces do not necessarily mean a larger net force."]},{"type":"number","prompt":"Using g = 10 m/s², find the gravitational weight of a 6 kg mass.","answer":60,"unit":"N","tolerance":0,"explanation":"Weight magnitude is mg = 6 × 10 = 60 N.","id":"reason","hints":["Newton’s first law describes constant velocity when net force is zero in an inertial frame. Rest is only one possible constant-velocity state.","Newton’s second law relates net force on one object to that object’s acceleration. More individual forces do not necessarily mean a larger net force."]},{"type":"choice","prompt":"Which is the third-law partner of Earth pulling down on a book?","options":["The table pushing up on the book","Friction on the book","The book’s acceleration","The book pulling gravitationally on Earth"],"answer":3,"explanation":"The partner force acts on Earth and is exerted by the book; the normal force acts on the book.","id":"transfer","hints":["Newton’s second law relates net force on one object to that object’s acceleration. More individual forces do not necessarily mean a larger net force.","Third-law partners are equal and opposite forces acting on different objects. Weight and normal force on the same block are not a third-law pair."]}]},{"id":"ph-01-06-workshop-v1","title":"Motion with Constant Acceleration","asset":"ph01-06","stages":[{"id":"map","type":"selection","prompt":"Select the assumption required by the displayed kinematic relations.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Constant acceleration. For constant acceleration in one dimension, v = v0 + at and Δx = v0t + ½at². Choose signed values along one consistent axis.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","The relation v² = v0² + 2aΔx eliminates time. The mean of initial and final velocity equals average velocity only when acceleration is constant over the interval."]},{"type":"number","prompt":"A cart starts from rest with constant a = +2 m/s² for 3 s. Find its displacement.","answer":9,"unit":"m","tolerance":0,"explanation":"Constant acceleration with zero initial velocity gives Δx = ½at² = ½(2)(3²) = +9 m.","id":"reason","hints":["For constant acceleration in one dimension, v = v0 + at and Δx = v0t + ½at². Choose signed values along one consistent axis.","The relation v² = v0² + 2aΔx eliminates time. The mean of initial and final velocity equals average velocity only when acceleration is constant over the interval."]},{"type":"number","prompt":"Take upward as positive and g = 10 m/s². What is ay at the top of a drag-free vertical toss?","answer":-10,"unit":"m/s²","tolerance":0,"explanation":"Gravity remains downward throughout flight, so ay = -10 m/s² even when instantaneous velocity is zero.","id":"transfer","hints":["The relation v² = v0² + 2aΔx eliminates time. The mean of initial and final velocity equals average velocity only when acceleration is constant over the interval.","Near Earth’s surface, free fall can be approximated with constant downward g when air resistance is negligible. At the top of a vertical toss, velocity is zero but acceleration is still downward."]}]},{"id":"ph-01-07-workshop-v1","title":"Mechanical Equilibrium","asset":"ph01-07","stages":[{"id":"map","type":"selection","prompt":"Select the reference point about which torque is evaluated.","answer":["part-0"],"explanation":"The relevant diagram entity or entities are Pivot. Translational equilibrium requires zero net force. Rotational equilibrium requires zero net torque about an axis; complete static equilibrium requires both.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Torque magnitude is rF sin θ, or force times its perpendicular lever arm. A force applied through the pivot has zero torque about that pivot."]},{"type":"number","prompt":"A 12 N force acts perpendicular to a lever 0.5 m from its pivot. Find torque magnitude.","answer":6,"unit":"N·m","tolerance":0,"explanation":"τ = rF = 0.5 × 12 = 6 N·m.","id":"reason","hints":["Translational equilibrium requires zero net force. Rotational equilibrium requires zero net torque about an axis; complete static equilibrium requires both.","Torque magnitude is rF sin θ, or force times its perpendicular lever arm. A force applied through the pivot has zero torque about that pivot."]},{"type":"choice","prompt":"A force’s line of action passes through the pivot. What is its torque about that pivot?","options":["Equal to the force in newtons","Zero","Always clockwise","Infinite"],"answer":1,"explanation":"Its perpendicular lever arm is zero, so torque about that pivot is zero.","id":"transfer","hints":["Torque magnitude is rF sin θ, or force times its perpendicular lever arm. A force applied through the pivot has zero torque about that pivot.","Choose a rotation sign convention before summing torques. Equal force magnitudes can produce different torques when lever arms differ."]}]}]},{"version":1,"id":"chapter-02","title":"Work and Energy","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-2-1","title":"Energy","section":"2.1","asset":"ph02-01","steps":[{"text":"Kinetic energy for nonrelativistic translation is ½mv². Gravitational potential near Earth can be written mgh relative to a chosen zero; elastic potential for an ideal spring is ½kx².","focus":["part-0"]},{"text":"For a system with only conservative work exchanged internally, mechanical energy can remain constant while kinetic and potential forms trade. Total energy conservation is broader than mechanical-energy conservation.","focus":["part-1"]},{"text":"Friction can convert organized mechanical energy into internal energy. Energy has not disappeared when mechanical energy decreases.","focus":["part-2"]},{"text":"Define the system boundary and included forms before applying conservation. A change in the potential-energy reference shifts values without changing measurable energy differences.","focus":["part-3"]}],"coreRule":{"title":"2.1 · Energy: the governing relation","paragraphs":["Kinetic energy for nonrelativistic translation is ½mv². Gravitational potential near Earth can be written mgh relative to a chosen zero; elastic potential for an ideal spring is ½kx².","For a system with only conservative work exchanged internally, mechanical energy can remain constant while kinetic and potential forms trade. Total energy conservation is broader than mechanical-energy conservation."]},"memoryCue":{"title":"2.1 · Energy changes form; the system boundary decides the bookkeeping.","paragraphs":["Energy changes form; the system boundary decides the bookkeeping.","For a system with only conservative work exchanged internally, mechanical energy can remain constant while kinetic and potential forms trade. Total energy conservation is broader than mechanical-energy conservation."]},"traps":{"title":"2.1 · Check signs, assumptions and meaning","paragraphs":["Friction can convert organized mechanical energy into internal energy. Energy has not disappeared when mechanical energy decreases.","Define the system boundary and included forms before applying conservation. A change in the potential-energy reference shifts values without changing measurable energy differences."]},"application":{"title":"2.1 · Apply the model within its limits","paragraphs":["Define the system boundary and included forms before applying conservation. A change in the potential-energy reference shifts values without changing measurable energy differences.","K = ½mv² = ½ × 2 × 3² = 9 J."]}},{"id":"concept-2-2","title":"Work","section":"2.2","asset":"ph02-02","steps":[{"text":"For a constant force, work on an object is W = Fd cos θ, where θ is between force and displacement. Work is a scalar that may be positive, negative or zero.","focus":["part-0"]},{"text":"Net work equals the change in kinetic energy. A force perpendicular to displacement does no work, even if its magnitude is large.","focus":["part-1"]},{"text":"Average power is work divided by time. Instantaneous mechanical power is the dot product F·v; force magnitude alone does not determine power.","focus":["part-2"]},{"text":"Lifting a load at constant speed can require positive work by the lifter while gravity does equal negative work. Zero net work is compatible with nonzero work by individual forces.","focus":["part-3"]}],"coreRule":{"title":"2.2 · Work: the governing relation","paragraphs":["For a constant force, work on an object is W = Fd cos θ, where θ is between force and displacement. Work is a scalar that may be positive, negative or zero.","Net work equals the change in kinetic energy. A force perpendicular to displacement does no work, even if its magnitude is large."]},"memoryCue":{"title":"2.2 · Work uses the force component along displacement.","paragraphs":["Work uses the force component along displacement.","Net work equals the change in kinetic energy. A force perpendicular to displacement does no work, even if its magnitude is large."]},"traps":{"title":"2.2 · Check signs, assumptions and meaning","paragraphs":["Average power is work divided by time. Instantaneous mechanical power is the dot product F·v; force magnitude alone does not determine power.","Lifting a load at constant speed can require positive work by the lifter while gravity does equal negative work. Zero net work is compatible with nonzero work by individual forces."]},"application":{"title":"2.2 · Apply the model within its limits","paragraphs":["Lifting a load at constant speed can require positive work by the lifter while gravity does equal negative work. Zero net work is compatible with nonzero work by individual forces.","W = Fd cos 0° = 15 × 4 = 60 J."]}},{"id":"concept-2-3","title":"Mechanical Advantage","section":"2.3","asset":"ph02-03","steps":[{"text":"Mechanical advantage is output force divided by input force. An ideal lossless machine trades a smaller input force for a greater input displacement.","focus":["part-0"]},{"text":"For an ideal machine, input work equals output work. Real machines have efficiency below one when some input energy is dissipated outside the desired output.","focus":["part-1"]},{"text":"Count supporting rope segments for a specified ideal pulley arrangement; the number of visible pulleys alone does not determine mechanical advantage.","focus":["part-2"]},{"text":"Efficiency is useful output energy divided by input energy. Force gain does not imply energy gain, and a force comparison alone does not establish efficiency.","focus":["part-3"]}],"coreRule":{"title":"2.3 · Mechanical Advantage: the governing relation","paragraphs":["Mechanical advantage is output force divided by input force. An ideal lossless machine trades a smaller input force for a greater input displacement.","For an ideal machine, input work equals output work. Real machines have efficiency below one when some input energy is dissipated outside the desired output."]},"memoryCue":{"title":"2.3 · Gain force by paying distance, not by creating energy.","paragraphs":["Gain force by paying distance, not by creating energy.","For an ideal machine, input work equals output work. Real machines have efficiency below one when some input energy is dissipated outside the desired output."]},"traps":{"title":"2.3 · Check signs, assumptions and meaning","paragraphs":["Count supporting rope segments for a specified ideal pulley arrangement; the number of visible pulleys alone does not determine mechanical advantage.","Efficiency is useful output energy divided by input energy. Force gain does not imply energy gain, and a force comparison alone does not establish efficiency."]},"application":{"title":"2.3 · Apply the model within its limits","paragraphs":["Efficiency is useful output energy divided by input energy. Force gain does not imply energy gain, and a force comparison alone does not establish efficiency.","MA = Fout/Fin = 120/30 = 4."]}}],"exercises":[{"id":"ph-02-01-workshop-v1","title":"Energy","asset":"ph02-01","stages":[{"id":"map","type":"selection","prompt":"Select the energy associated with an object’s motion.","answer":["part-0"],"explanation":"The relevant diagram entity or entities are Kinetic energy. Kinetic energy for nonrelativistic translation is ½mv². Gravitational potential near Earth can be written mgh relative to a chosen zero; elastic potential for an ideal spring is ½kx².","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","For a system with only conservative work exchanged internally, mechanical energy can remain constant while kinetic and potential forms trade. Total energy conservation is broader than mechanical-energy conservation."]},{"type":"number","prompt":"Find the kinetic energy of a 2 kg object moving at 3 m/s.","answer":9,"unit":"J","tolerance":0,"explanation":"K = ½mv² = ½ × 2 × 3² = 9 J.","id":"reason","hints":["Kinetic energy for nonrelativistic translation is ½mv². Gravitational potential near Earth can be written mgh relative to a chosen zero; elastic potential for an ideal spring is ½kx².","For a system with only conservative work exchanged internally, mechanical energy can remain constant while kinetic and potential forms trade. Total energy conservation is broader than mechanical-energy conservation."]},{"type":"number","prompt":"Using g = 10 m/s², find the increase in gravitational potential energy when 4 kg rises by 2 m.","answer":80,"unit":"J","tolerance":0,"explanation":"ΔU = mgΔh = 4 × 10 × 2 = 80 J.","id":"transfer","hints":["For a system with only conservative work exchanged internally, mechanical energy can remain constant while kinetic and potential forms trade. Total energy conservation is broader than mechanical-energy conservation.","Friction can convert organized mechanical energy into internal energy. Energy has not disappeared when mechanical energy decreases."]}]},{"id":"ph-02-02-workshop-v1","title":"Work","asset":"ph02-02","stages":[{"id":"map","type":"selection","prompt":"Select the quantity that measures energy transfer per unit time.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Power. For a constant force, work on an object is W = Fd cos θ, where θ is between force and displacement. Work is a scalar that may be positive, negative or zero.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Net work equals the change in kinetic energy. A force perpendicular to displacement does no work, even if its magnitude is large."]},{"type":"number","prompt":"A constant 15 N force acts parallel to a 4 m displacement. Find its work.","answer":60,"unit":"J","tolerance":0,"explanation":"W = Fd cos 0° = 15 × 4 = 60 J.","id":"reason","hints":["For a constant force, work on an object is W = Fd cos θ, where θ is between force and displacement. Work is a scalar that may be positive, negative or zero.","Net work equals the change in kinetic energy. A force perpendicular to displacement does no work, even if its magnitude is large."]},{"type":"number","prompt":"A machine transfers 240 J in 6 s. Find its average power.","answer":40,"unit":"W","tolerance":0,"explanation":"Pavg = W/Δt = 240/6 = 40 W.","id":"transfer","hints":["Net work equals the change in kinetic energy. A force perpendicular to displacement does no work, even if its magnitude is large.","Average power is work divided by time. Instantaneous mechanical power is the dot product F·v; force magnitude alone does not determine power."]}]},{"id":"ph-02-03-workshop-v1","title":"Mechanical Advantage","asset":"ph02-03","stages":[{"id":"map","type":"selection","prompt":"Select both input quantities whose product gives ideal input work for parallel force and motion.","answer":["part-0","part-1"],"explanation":"The relevant diagram entity or entities are Input force, Input distance. Mechanical advantage is output force divided by input force. An ideal lossless machine trades a smaller input force for a greater input displacement.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","For an ideal machine, input work equals output work. Real machines have efficiency below one when some input energy is dissipated outside the desired output."]},{"type":"number","prompt":"An ideal machine lifts a 120 N load using a 30 N input force. Find mechanical advantage.","answer":4,"unit":"dimensionless","tolerance":0,"explanation":"MA = Fout/Fin = 120/30 = 4.","id":"reason","hints":["Mechanical advantage is output force divided by input force. An ideal lossless machine trades a smaller input force for a greater input displacement.","For an ideal machine, input work equals output work. Real machines have efficiency below one when some input energy is dissipated outside the desired output."]},{"type":"number","prompt":"A device receives 100 J and delivers 75 J of useful output. Find efficiency as a fraction.","answer":0.75,"unit":"dimensionless","tolerance":0,"explanation":"Efficiency = useful output / input = 75/100 = 0.75.","id":"transfer","hints":["For an ideal machine, input work equals output work. Real machines have efficiency below one when some input energy is dissipated outside the desired output.","Count supporting rope segments for a specified ideal pulley arrangement; the number of visible pulleys alone does not determine mechanical advantage."]}]}]},{"version":1,"id":"chapter-03","title":"Thermodynamics","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-3-1","title":"Zeroth Law of Thermodynamics","section":"3.1","asset":"ph03-01","steps":[{"text":"Temperature describes thermal equilibrium and relates to microscopic energy distributions. Heat is energy transferred because of a temperature difference, not a substance stored inside an object.","focus":["part-0"]},{"text":"The zeroth law makes thermal equilibrium transitive: if A and B are separately in thermal equilibrium with C, A and B are in equilibrium with each other.","focus":["part-1"]},{"text":"Equal temperature does not require equal total internal energy. Amount of material, composition and phase can change internal energy at the same temperature.","focus":["part-2"]},{"text":"Use kelvin for absolute-temperature ratios. Celsius intervals equal kelvin intervals, but Celsius zero is not absolute zero.","focus":["part-3"]}],"coreRule":{"title":"3.1 · Zeroth Law of Thermodynamics: the governing relation","paragraphs":["Temperature describes thermal equilibrium and relates to microscopic energy distributions. Heat is energy transferred because of a temperature difference, not a substance stored inside an object.","The zeroth law makes thermal equilibrium transitive: if A and B are separately in thermal equilibrium with C, A and B are in equilibrium with each other."]},"memoryCue":{"title":"3.1 · Temperature is a state variable; heat crosses a boundary.","paragraphs":["Temperature is a state variable; heat crosses a boundary.","The zeroth law makes thermal equilibrium transitive: if A and B are separately in thermal equilibrium with C, A and B are in equilibrium with each other."]},"traps":{"title":"3.1 · Check signs, assumptions and meaning","paragraphs":["Equal temperature does not require equal total internal energy. Amount of material, composition and phase can change internal energy at the same temperature.","Use kelvin for absolute-temperature ratios. Celsius intervals equal kelvin intervals, but Celsius zero is not absolute zero."]},"application":{"title":"3.1 · Apply the model within its limits","paragraphs":["Use kelvin for absolute-temperature ratios. Celsius intervals equal kelvin intervals, but Celsius zero is not absolute zero.","The kelvin offset is added to the Celsius value: 20 + 273.15 = 293.15 K."]}},{"id":"concept-3-2","title":"Systems","section":"3.2","asset":"ph03-02","steps":[{"text":"A thermodynamic system is the part selected for study; everything else is surroundings. The boundary determines which exchanges must be counted.","focus":["part-0"]},{"text":"An open system exchanges matter and energy; a closed system exchanges energy but not matter. An isolated system exchanges neither with its surroundings.","focus":["part-1"]},{"text":"A closed system is not automatically adiabatic. Adiabatic means no heat transfer across the boundary, but work can still change internal energy.","focus":["part-2"]},{"text":"State functions depend on state rather than process path. Heat and work depend on the path taken between states, so they are not stored state functions.","focus":["part-3"]}],"coreRule":{"title":"3.2 · Systems: the governing relation","paragraphs":["A thermodynamic system is the part selected for study; everything else is surroundings. The boundary determines which exchanges must be counted.","An open system exchanges matter and energy; a closed system exchanges energy but not matter. An isolated system exchanges neither with its surroundings."]},"memoryCue":{"title":"3.2 · Closed blocks matter; isolated blocks matter and energy.","paragraphs":["Closed blocks matter; isolated blocks matter and energy.","An open system exchanges matter and energy; a closed system exchanges energy but not matter. An isolated system exchanges neither with its surroundings."]},"traps":{"title":"3.2 · Check signs, assumptions and meaning","paragraphs":["A closed system is not automatically adiabatic. Adiabatic means no heat transfer across the boundary, but work can still change internal energy.","State functions depend on state rather than process path. Heat and work depend on the path taken between states, so they are not stored state functions."]},"application":{"title":"3.2 · Apply the model within its limits","paragraphs":["State functions depend on state rather than process path. Heat and work depend on the path taken between states, so they are not stored state functions.","Closed systems can exchange energy through heat while retaining matter."]}},{"id":"concept-3-3","title":"First Law of Thermodynamics","section":"3.3","asset":"ph03-03","steps":[{"text":"Use the convention ΔU = Q - Wby, where Q is positive for heat entering the system and Wby is positive for work done by the system on its surroundings.","focus":["part-0"]},{"text":"A gas expanding against external pressure does positive work in this convention. Compression does negative work by the gas, which tends to increase its internal energy.","focus":["part-1"]},{"text":"For a quasistatic pressure-volume process, work by the gas is the area under its P–V curve. A cyclic process returns to its initial internal energy but can exchange net heat and work.","focus":["part-2"]},{"text":"For a monatomic ideal gas with fixed amount, internal energy depends on absolute temperature. During an ideal-gas isothermal process, ΔU = 0; heat and work need not vanish.","focus":["part-3"]}],"coreRule":{"title":"3.3 · First Law of Thermodynamics: the governing relation","paragraphs":["Use the convention ΔU = Q - Wby, where Q is positive for heat entering the system and Wby is positive for work done by the system on its surroundings.","A gas expanding against external pressure does positive work in this convention. Compression does negative work by the gas, which tends to increase its internal energy."]},"memoryCue":{"title":"3.3 · Name the work convention before choosing the sign.","paragraphs":["Name the work convention before choosing the sign.","A gas expanding against external pressure does positive work in this convention. Compression does negative work by the gas, which tends to increase its internal energy."]},"traps":{"title":"3.3 · Check signs, assumptions and meaning","paragraphs":["For a quasistatic pressure-volume process, work by the gas is the area under its P–V curve. A cyclic process returns to its initial internal energy but can exchange net heat and work.","For a monatomic ideal gas with fixed amount, internal energy depends on absolute temperature. During an ideal-gas isothermal process, ΔU = 0; heat and work need not vanish."]},"application":{"title":"3.3 · Apply the model within its limits","paragraphs":["For a monatomic ideal gas with fixed amount, internal energy depends on absolute temperature. During an ideal-gas isothermal process, ΔU = 0; heat and work need not vanish.","With heat into the gas positive and work by the gas positive, ΔU = Q - Wby = 500 - 180 = +320 J."]}},{"id":"concept-3-4","title":"Second Law of Thermodynamics and Entropy","section":"3.4","asset":"ph03-04","steps":[{"text":"Entropy is a state function related to energy dispersal and accessible microscopic arrangements. A local entropy decrease can occur when it is offset by a larger surroundings increase.","focus":["part-0"]},{"text":"For a reversible heat transfer at fixed absolute temperature, ΔS = Qrev/T. This expression uses a reversible path, even when the actual process is irreversible.","focus":["part-1"]},{"text":"For an isolated system, total entropy does not decrease. For a spontaneous irreversible process, entropy of the system plus surroundings increases; a reversible idealization has zero total change.","focus":["part-2"]},{"text":"Heat naturally flows from hotter to colder regions without external work. A refrigerator can move heat the other way by requiring work and increasing total entropy.","focus":["part-3"]}],"coreRule":{"title":"3.4 · Second Law of Thermodynamics and Entropy: the governing relation","paragraphs":["Entropy is a state function related to energy dispersal and accessible microscopic arrangements. A local entropy decrease can occur when it is offset by a larger surroundings increase.","For a reversible heat transfer at fixed absolute temperature, ΔS = Qrev/T. This expression uses a reversible path, even when the actual process is irreversible."]},"memoryCue":{"title":"3.4 · A local decrease can coexist with a larger global increase.","paragraphs":["A local decrease can coexist with a larger global increase.","For a reversible heat transfer at fixed absolute temperature, ΔS = Qrev/T. This expression uses a reversible path, even when the actual process is irreversible."]},"traps":{"title":"3.4 · Check signs, assumptions and meaning","paragraphs":["For an isolated system, total entropy does not decrease. For a spontaneous irreversible process, entropy of the system plus surroundings increases; a reversible idealization has zero total change.","Heat naturally flows from hotter to colder regions without external work. A refrigerator can move heat the other way by requiring work and increasing total entropy."]},"application":{"title":"3.4 · Apply the model within its limits","paragraphs":["Heat naturally flows from hotter to colder regions without external work. A refrigerator can move heat the other way by requiring work and increasing total entropy.","ΔS = Qrev/T = 600/300 = +2 J/K."]}}],"exercises":[{"id":"ph-03-01-workshop-v1","title":"Zeroth Law of Thermodynamics","asset":"ph03-01","stages":[{"id":"map","type":"selection","prompt":"Select the instrument brought into equilibrium to infer temperature.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Thermometer. Temperature describes thermal equilibrium and relates to microscopic energy distributions. Heat is energy transferred because of a temperature difference, not a substance stored inside an object.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","The zeroth law makes thermal equilibrium transitive: if A and B are separately in thermal equilibrium with C, A and B are in equilibrium with each other."]},{"type":"number","prompt":"Using T(K) = T(°C) + 273.15, convert 20 °C to kelvin.","answer":293.15,"unit":"K","tolerance":0.000001,"explanation":"The kelvin offset is added to the Celsius value: 20 + 273.15 = 293.15 K.","id":"reason","hints":["Temperature describes thermal equilibrium and relates to microscopic energy distributions. Heat is energy transferred because of a temperature difference, not a substance stored inside an object.","The zeroth law makes thermal equilibrium transitive: if A and B are separately in thermal equilibrium with C, A and B are in equilibrium with each other."]},{"type":"choice","prompt":"Two objects have equal temperature but different masses. Must their internal energies be equal?","options":["Yes, always","No; amount and composition also matter","Only if they are touching","Temperature equals total internal energy"],"answer":1,"explanation":"Temperature alone does not determine total internal energy.","id":"transfer","hints":["The zeroth law makes thermal equilibrium transitive: if A and B are separately in thermal equilibrium with C, A and B are in equilibrium with each other.","Equal temperature does not require equal total internal energy. Amount of material, composition and phase can change internal energy at the same temperature."]}]},{"id":"ph-03-02-workshop-v1","title":"Systems","asset":"ph03-02","stages":[{"id":"map","type":"selection","prompt":"Select the feature separating the chosen system from its surroundings.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Boundary. A thermodynamic system is the part selected for study; everything else is surroundings. The boundary determines which exchanges must be counted.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","An open system exchanges matter and energy; a closed system exchanges energy but not matter. An isolated system exchanges neither with its surroundings."]},{"type":"choice","prompt":"A sealed rigid metal container can exchange heat but no matter. Which label fits?","options":["Open because heat moves","Closed, not necessarily isolated","Always isolated","Always adiabatic"],"answer":1,"explanation":"Closed systems can exchange energy through heat while retaining matter.","id":"reason","hints":["A thermodynamic system is the part selected for study; everything else is surroundings. The boundary determines which exchanges must be counted.","An open system exchanges matter and energy; a closed system exchanges energy but not matter. An isolated system exchanges neither with its surroundings."]},{"type":"choice","prompt":"Which quantity is a state function?","options":["Heat transferred","Path-specific work","Internal energy","Distance traveled through a process"],"answer":2,"explanation":"Internal energy depends on thermodynamic state; heat and work describe transfers along a process.","id":"transfer","hints":["An open system exchanges matter and energy; a closed system exchanges energy but not matter. An isolated system exchanges neither with its surroundings.","A closed system is not automatically adiabatic. Adiabatic means no heat transfer across the boundary, but work can still change internal energy."]}]},{"id":"ph-03-03-workshop-v1","title":"First Law of Thermodynamics","asset":"ph03-03","stages":[{"id":"map","type":"selection","prompt":"Select the energy transfer that is positive when the gas expands against an external pressure.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Work by gas. Use the convention ΔU = Q - Wby, where Q is positive for heat entering the system and Wby is positive for work done by the system on its surroundings.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A gas expanding against external pressure does positive work in this convention. Compression does negative work by the gas, which tends to increase its internal energy."]},{"type":"number","prompt":"A gas absorbs Q = +500 J and does Wby = +180 J. Find ΔU using ΔU = Q - Wby.","answer":320,"unit":"J","tolerance":0,"explanation":"With heat into the gas positive and work by the gas positive, ΔU = Q - Wby = 500 - 180 = +320 J.","id":"reason","hints":["Use the convention ΔU = Q - Wby, where Q is positive for heat entering the system and Wby is positive for work done by the system on its surroundings.","A gas expanding against external pressure does positive work in this convention. Compression does negative work by the gas, which tends to increase its internal energy."]},{"type":"number","prompt":"An adiabatic gas is compressed, so Wby = -70 J. Find ΔU.","answer":70,"unit":"J","tolerance":0,"explanation":"Adiabatic means Q = 0; ΔU = 0 - (-70) = +70 J.","id":"transfer","hints":["A gas expanding against external pressure does positive work in this convention. Compression does negative work by the gas, which tends to increase its internal energy.","For a quasistatic pressure-volume process, work by the gas is the area under its P–V curve. A cyclic process returns to its initial internal energy but can exchange net heat and work."]}]},{"id":"ph-03-04-workshop-v1","title":"Second Law of Thermodynamics and Entropy","asset":"ph03-04","stages":[{"id":"map","type":"selection","prompt":"Select the quantity constrained not to decrease for an isolated combined system.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Total entropy. Entropy is a state function related to energy dispersal and accessible microscopic arrangements. A local entropy decrease can occur when it is offset by a larger surroundings increase.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","For a reversible heat transfer at fixed absolute temperature, ΔS = Qrev/T. This expression uses a reversible path, even when the actual process is irreversible."]},{"type":"number","prompt":"A reservoir receives 600 J reversibly at a constant 300 K. Find its entropy change.","answer":2,"unit":"J/K","tolerance":0,"explanation":"ΔS = Qrev/T = 600/300 = +2 J/K.","id":"reason","hints":["Entropy is a state function related to energy dispersal and accessible microscopic arrangements. A local entropy decrease can occur when it is offset by a larger surroundings increase.","For a reversible heat transfer at fixed absolute temperature, ΔS = Qrev/T. This expression uses a reversible path, even when the actual process is irreversible."]},{"type":"choice","prompt":"A refrigerator lowers entropy inside its cold compartment. What must be considered?","options":["The surroundings and supplied work as well","Only the compartment","A required violation of the second law","An entropy decrease of the entire isolated universe"],"answer":0,"explanation":"A refrigerator uses work and releases heat; the combined entropy balance can satisfy the second law.","id":"transfer","hints":["For a reversible heat transfer at fixed absolute temperature, ΔS = Qrev/T. This expression uses a reversible path, even when the actual process is irreversible.","For an isolated system, total entropy does not decrease. For a spontaneous irreversible process, entropy of the system plus surroundings increases; a reversible idealization has zero total change."]}]}]},{"version":1,"id":"chapter-04","title":"Fluids","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-4-1","title":"Characteristics of Fluids and Solids","section":"4.1","asset":"ph04-01","steps":[{"text":"Density is mass per volume. Pressure is force per area, while viscosity characterizes resistance to shear flow; these are different properties.","focus":["part-0"]},{"text":"A fluid at rest does not sustain a static shear stress like an elastic solid. Liquids and gases flow under sustained shear, although their compressibilities differ.","focus":["part-1"]},{"text":"A nearly incompressible liquid model holds density approximately fixed. Treating a gas this way requires a justified regime rather than a universal assumption.","focus":["part-2"]},{"text":"Viscosity influences flow resistance and dissipation. A denser fluid is not necessarily more viscous; compare measured or stated properties separately.","focus":["part-3"]}],"coreRule":{"title":"4.1 · Characteristics of Fluids and Solids: the governing relation","paragraphs":["Density is mass per volume. Pressure is force per area, while viscosity characterizes resistance to shear flow; these are different properties.","A fluid at rest does not sustain a static shear stress like an elastic solid. Liquids and gases flow under sustained shear, although their compressibilities differ."]},"memoryCue":{"title":"4.1 · Density counts mass per volume; viscosity resists shear flow.","paragraphs":["Density counts mass per volume; viscosity resists shear flow.","A fluid at rest does not sustain a static shear stress like an elastic solid. Liquids and gases flow under sustained shear, although their compressibilities differ."]},"traps":{"title":"4.1 · Check signs, assumptions and meaning","paragraphs":["A nearly incompressible liquid model holds density approximately fixed. Treating a gas this way requires a justified regime rather than a universal assumption.","Viscosity influences flow resistance and dissipation. A denser fluid is not necessarily more viscous; compare measured or stated properties separately."]},"application":{"title":"4.1 · Apply the model within its limits","paragraphs":["Viscosity influences flow resistance and dissipation. A denser fluid is not necessarily more viscous; compare measured or stated properties separately.","ρ = m/V = 0.8/0.001 = 800 kg/m³."]}},{"id":"concept-4-2","title":"Hydrostatics","section":"4.2","asset":"ph04-02","steps":[{"text":"For a static liquid of uniform density, pressure at depth h is Psurface + ρgh. Gauge pressure subtracts the chosen reference atmospheric pressure.","focus":["part-0"]},{"text":"At the same depth in one connected static fluid, pressure is equal. Vessel shape does not alter the hydrostatic depth contribution under these assumptions.","focus":["part-1"]},{"text":"Buoyant force equals the weight of displaced fluid. It depends on submerged volume and fluid density, not automatically on the entire object’s weight.","focus":["part-2"]},{"text":"A floating object has buoyancy balancing its weight in static equilibrium. For a fully submerged object, compare density and other forces before predicting motion.","focus":["part-3"]}],"coreRule":{"title":"4.2 · Hydrostatics: the governing relation","paragraphs":["For a static liquid of uniform density, pressure at depth h is Psurface + ρgh. Gauge pressure subtracts the chosen reference atmospheric pressure.","At the same depth in one connected static fluid, pressure is equal. Vessel shape does not alter the hydrostatic depth contribution under these assumptions."]},"memoryCue":{"title":"4.2 · Depth sets hydrostatic pressure; displaced fluid sets buoyancy.","paragraphs":["Depth sets hydrostatic pressure; displaced fluid sets buoyancy.","At the same depth in one connected static fluid, pressure is equal. Vessel shape does not alter the hydrostatic depth contribution under these assumptions."]},"traps":{"title":"4.2 · Check signs, assumptions and meaning","paragraphs":["Buoyant force equals the weight of displaced fluid. It depends on submerged volume and fluid density, not automatically on the entire object’s weight.","A floating object has buoyancy balancing its weight in static equilibrium. For a fully submerged object, compare density and other forces before predicting motion."]},"application":{"title":"4.2 · Apply the model within its limits","paragraphs":["A floating object has buoyancy balancing its weight in static equilibrium. For a fully submerged object, compare density and other forces before predicting motion.","Pgauge = ρgh = 1000 × 10 × 2 = 20000 Pa."]}},{"id":"concept-4-3","title":"Fluid Dynamics","section":"4.3","asset":"ph04-03","steps":[{"text":"For steady incompressible flow through an unbranched tube, continuity gives A1v1 = A2v2. A smaller area requires a larger mean flow speed at the same volume flow rate.","focus":["part-0"]},{"text":"Bernoulli’s relation P + ½ρv² + ρgh = constant applies along a streamline for steady incompressible flow with negligible viscous losses and no intervening pump work.","focus":["part-1"]},{"text":"For laminar Newtonian flow in a long cylindrical tube, Poiseuille resistance is 8ηL/(πr⁴). Radius changes have a fourth-power effect only within this model’s assumptions.","focus":["part-2"]},{"text":"Real vascular flow can be pulsatile, branched and dissipative. Do not apply a frictionless constant-Bernoulli sum across every real vessel or a pressure-adding pump.","focus":["part-3"]}],"coreRule":{"title":"4.3 · Fluid Dynamics: the governing relation","paragraphs":["For steady incompressible flow through an unbranched tube, continuity gives A1v1 = A2v2. A smaller area requires a larger mean flow speed at the same volume flow rate.","Bernoulli’s relation P + ½ρv² + ρgh = constant applies along a streamline for steady incompressible flow with negligible viscous losses and no intervening pump work."]},"memoryCue":{"title":"4.3 · Continuity tracks volume; Bernoulli tracks ideal mechanical energy.","paragraphs":["Continuity tracks volume; Bernoulli tracks ideal mechanical energy.","Bernoulli’s relation P + ½ρv² + ρgh = constant applies along a streamline for steady incompressible flow with negligible viscous losses and no intervening pump work."]},"traps":{"title":"4.3 · Check signs, assumptions and meaning","paragraphs":["For laminar Newtonian flow in a long cylindrical tube, Poiseuille resistance is 8ηL/(πr⁴). Radius changes have a fourth-power effect only within this model’s assumptions.","Real vascular flow can be pulsatile, branched and dissipative. Do not apply a frictionless constant-Bernoulli sum across every real vessel or a pressure-adding pump."]},"application":{"title":"4.3 · Apply the model within its limits","paragraphs":["Real vascular flow can be pulsatile, branched and dissipative. Do not apply a frictionless constant-Bernoulli sum across every real vessel or a pressure-adding pump.","A1v1 = A2v2 gives v2 = (6/3) × 2 = 4 m/s."]}},{"id":"concept-4-4","title":"Fluids in Physiology","section":"4.4","asset":"ph04-04","steps":[{"text":"A useful circulation model relates volume flow to driving pressure difference divided by resistance: Qflow = ΔP/R. Volume flow is not the same quantity as local speed.","focus":["part-0"]},{"text":"Parallel vessels can have a large combined area, lowering average speed for a given total flow. Narrowing one vessel differs from distributing flow across many small vessels.","focus":["part-1"]},{"text":"A simplified cylindrical-vessel model predicts strong radius sensitivity, but real blood is cellular and vessels can change diameter. State assumptions before using a rigid Newtonian-tube equation.","focus":["part-2"]},{"text":"Conservation of flow applies at junctions: total inflow equals total outflow in steady conditions. Physiological variation and compliance can make instantaneous flows differ from steady averages.","focus":["part-3"]}],"coreRule":{"title":"4.4 · Fluids in Physiology: the governing relation","paragraphs":["A useful circulation model relates volume flow to driving pressure difference divided by resistance: Qflow = ΔP/R. Volume flow is not the same quantity as local speed.","Parallel vessels can have a large combined area, lowering average speed for a given total flow. Narrowing one vessel differs from distributing flow across many small vessels."]},"memoryCue":{"title":"4.4 · Flow needs a pressure difference; speed also needs total area.","paragraphs":["Flow needs a pressure difference; speed also needs total area.","Parallel vessels can have a large combined area, lowering average speed for a given total flow. Narrowing one vessel differs from distributing flow across many small vessels."]},"traps":{"title":"4.4 · Check signs, assumptions and meaning","paragraphs":["A simplified cylindrical-vessel model predicts strong radius sensitivity, but real blood is cellular and vessels can change diameter. State assumptions before using a rigid Newtonian-tube equation.","Conservation of flow applies at junctions: total inflow equals total outflow in steady conditions. Physiological variation and compliance can make instantaneous flows differ from steady averages."]},"application":{"title":"4.4 · Apply the model within its limits","paragraphs":["Conservation of flow applies at junctions: total inflow equals total outflow in steady conditions. Physiological variation and compliance can make instantaneous flows differ from steady averages.","Qflow = ΔP/R = 60/3 = 20 L/min; the pressure units cancel."]}}],"exercises":[{"id":"ph-04-01-workshop-v1","title":"Characteristics of Fluids and Solids","asset":"ph04-01","stages":[{"id":"map","type":"selection","prompt":"Select the property computed as mass divided by volume.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Density. Density is mass per volume. Pressure is force per area, while viscosity characterizes resistance to shear flow; these are different properties.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A fluid at rest does not sustain a static shear stress  = (6/3) × 2 = 4 m/s.","id":"reason","hints":["For steady incompressible flow through an unbranched tube, continuity gives A1v1 = A2v2. A smaller area requires a larger mean flow speed at the same volume flow rate.","Bernoulli’s relation P + ½ρv² + ρgh = constant applies along a streamline for steady incompressible flow with negligible viscous losses and no intervening pump work."]},{"type":"number","prompt":"For laminar Poiseuille flow with fixed viscosity and length, halving tube radius multiplies resistance by what factor?","answer":16,"unit":"dimensionless","tolerance":0,"explanation":"R is proportional to 1/r⁴, so the resistance ratio is 2⁴ = 16.","id":"transfer","hints":["Bernoulli’s relation P + ½ρv² + ρgh = constant applies along a streamline for steady incompressible flow with negligible viscous losses and no intervening pump work.","For laminar Newtonian flow in a long cylindrical tube, Poiseuille resistance is 8ηL/(πr⁴). Radius changes have a fourth-power effect only within this model’s assumptions."]}]},{"id":"ph-04-04-workshop-v1","title":"Fluids in Physiology","asset":"ph04-04","stages":[{"id":"map","type":"selection","prompt":"Select the driving term rather than the resistance or resulting flow.","answer":["part-0"],"explanation":"The relevant diagram entity or entities are Pressure difference. A useful circulation model relates volume flow to driving pressure difference divided by resistance: Qflow = ΔP/R. Volume flow is not the same quantity as local speed.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Parallel vessels can have a large combined area, lowering average speed for a given total flow. Narrowing one vessel differs from distributing flow across many small vessels."]},{"type":"number","prompt":"A vessel model has ΔP = 60 mmHg and R = 3 mmHg·min/L. Find volume flow.","answer":20,"unit":"L/min","tolerance":0,"explanation":"Qflow = ΔP/R = 60/3 = 20 L/min; the pressure units cancel.","id":"reason","hints":["A useful circulation model relates volume flow to driving pressure difference divided by resistance: Qflow = ΔP/R. Volume flow is not the same quantity as local speed.","Parallel vessels can have a large combined area, lowering average speed for a given total flow. Narrowing one vessel differs from distributing flow across many small vessels."]},{"type":"choice","prompt":"The same total volume flow enters a network with larger combined cross-sectional area. What happens to mean speed?","options":["It must increase","It decreases","It is always unchanged","It becomes a pressure"],"answer":1,"explanation":"Since Qflow = Atotalvmean, increasing total area at fixed flow lowers mean speed.","id":"transfer","hints":["Parallel vessels can have a large combined area, lowering average speed for a given total flow. Narrowing one vessel differs from distributing flow across many small vessels.","A simplified cylindrical-vessel model predicts strong radius sensitivity, but real blood is cellular and vessels can change diameter. State assumptions before using a rigid Newtonian-tube equation."]}]}]},{"version":1,"id":"chapter-05","title":"Electrostatics and Magnetism","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-5-1","title":"Charges","section":"5.1","asset":"ph05-01","steps":[{"text":"Electric charge is conserved and occurs in integer multiples of the elementary charge for ordinary isolated particles. A neutral object has balanced positive and negative charge, not an absence of charged constituents.","focus":["part-0"]},{"text":"Like charges repel and unlike charges attract. Charging by contact redistributes charge; polarization separates charge within an initially neutral object.","focus":["part-1"]},{"text":"In ordinary solid conductors, mobile electrons move while positive lattice ions remain approximately fixed. Conventional positive-current direction need not match electron drift.","focus":["part-2"]},{"text":"An isolated conductor can redistribute its charges without changing total charge. Grounding permits charge exchange with a much larger reservoir.","focus":["part-3"]}],"coreRule":{"title":"5.1 · Charges: the governing relation","paragraphs":["Electric charge is conserved and occurs in integer multiples of the elementary charge for ordinary isolated particles. A neutral object has balanced positive and negative charge, not an absence of charged constituents.","Like charges repel and unlike charges attract. Charging by contact redistributes charge; polarization separates charge within an initially neutral object."]},"memoryCue":{"title":"5.1 · Neutral means balanced charge, not no charge.","paragraphs":["Neutral means balanced charge, not no charge.","Like charges repel and unlike charges attract. Charging by contact redistributes charge; polarization separates charge within an initially neutral object."]},"traps":{"title":"5.1 · Check signs, assumptions and meaning","paragraphs":["In ordinary solid conductors, mobile electrons move while positive lattice ions remain approximately fixed. Conventional positive-current direction need not match electron drift.","An isolated conductor can redistribute its charges without changing total charge. Grounding permits charge exchange with a much larger reservoir."]},"application":{"title":"5.1 · Apply the model within its limits","paragraphs":["An isolated conductor can redistribute its charges without changing total charge. Grounding permits charge exchange with a much larger reservoir.","A positive charge of Q/e = 8.0/1.6 = 5 elementary charges corresponds to five missing electrons."]}},{"id":"concept-5-2","title":"Coulomb’s Law","section":"5.2","asset":"ph05-02","steps":[{"text":"For point charges in vacuum, Coulomb-force magnitude is k|q1q2|/r². The force lies along the line joining the charges.","focus":["part-0"]},{"text":"Superposition adds the forces from several sources as vectors. Cancellation depends on direction, not merely on equal magnitudes.","focus":["part-1"]},{"text":"Doubling separation divides force by four when the charges and medium are unchanged. The inverse-square law concerns center-to-center separation in the point-charge approximation.","focus":["part-2"]},{"text":"Electric field is force per positive test charge: E = F/qtest. Changing the test-charge sign reverses its force relative to the field but does not reverse the source field.","focus":["part-3"]}],"coreRule":{"title":"5.2 · Coulomb’s Law: the governing relation","paragraphs":["For point charges in vacuum, Coulomb-force magnitude is k|q1q2|/r². The force lies along the line joining the charges.","Superposition adds the forces from several sources as vectors. Cancellation depends on direction, not merely on equal magnitudes."]},"memoryCue":{"title":"5.2 · Charge products scale force; separation is squared.","paragraphs":["Charge products scale force; separation is squared.","Superposition adds the forces from several sources as vectors. Cancellation depends on direction, not merely on equal magnitudes."]},"traps":{"title":"5.2 · Check signs, assumptions and meaning","paragraphs":["Doubling separation divides force by four when the charges and medium are unchanged. The inverse-square law concerns center-to-center separation in the point-charge approximation.","Electric field is force per positive test charge: E = F/qtest. Changing the test-charge sign reverses its force relative to the field but does not reverse the source field."]},"application":{"title":"5.2 · Apply the model within its limits","paragraphs":["Electric field is force per positive test charge: E = F/qtest. Changing the test-charge sign reverses its force relative to the field but does not reverse the source field.","F scales as 1/r², so Fnew = 36/3² = 4 N."]}},{"id":"concept-5-3","title":"Electric Potential Energy","section":"5.3","asset":"ph05-03","steps":[{"text":"For two point charges in vacuum with zero energy at infinite separation, electric potential energy is U = kq1q2/r. Its sign depends on the signed charge product.","focus":["part-0"]},{"text":"Like-charge pairs have positive U in this convention; opposite-charge pairs have negative U. A negative potential energy is compatible with a stable choice of zero at infinity.","focus":["part-1"]},{"text":"For an electrostatic field, work done by the field equals -ΔU. External quasistatic work with no kinetic-energy change equals +ΔU.","focus":["part-2"]},{"text":"Potential energy belongs to a charge configuration, not to position alone. Changing the moving charge changes its energy even if the source potential is unchanged.","focus":["part-3"]}],"coreRule":{"title":"5.3 · Electric Potential Energy: the governing relation","paragraphs":["For two point charges in vacuum with zero energy at infinite separation, electric potential energy is U = kq1q2/r. Its sign depends on the signed charge product.","Like-charge pairs have positive U in this convention; opposite-charge pairs have negative U. A negative potential energy is compatible with a stable choice of zero at infinity."]},"memoryCue":{"title":"5.3 · Field work lowers potential energy.","paragraphs":["Field work lowers potential energy.","Like-charge pairs have positive U in this convention; opposite-charge pairs have negative U. A negative potential energy is compatible with a stable choice of zero at infinity."]},"traps":{"title":"5.3 · Check signs, assumptions and meaning","paragraphs":["For an electrostatic field, work done by the field equals -ΔU. External quasistatic work with no kinetic-energy change equals +ΔU.","Potential energy belongs to a charge configuration, not to position alone. Changing the moving charge changes its energy even if the source potential is unchanged."]},"application":{"title":"5.3 · Apply the model within its limits","paragraphs":["Potential energy belongs to a charge configuration, not to position alone. Changing the moving charge changes its energy even if the source potential is unchanged.","Wfield = -ΔU, so ΔU = -12 J."]}},{"id":"concept-5-4","title":"Electric Potential","section":"5.4","asset":"ph05-04","steps":[{"text":"Electric potential is potential energy per charge: V = U/q. A potential difference has units joules per coulomb, called volts.","focus":["part-0"]},{"text":"A charge moving across ΔV changes electric potential energy by qΔV. A negative charge reverses the energy-change sign relative to a positive charge.","focus":["part-1"]},{"text":"For a uniform one-dimensional field, Ex = -ΔV/Δx. The field points toward decreasing potential, while force direction also depends on the sign of the charge.","focus":["part-2"]},{"text":"Equipotential surfaces require no electrostatic work for motion along them. Zero potential at a point does not necessarily imply zero electric field there.","focus":["part-3"]}],"coreRule":{"title":"5.4 · Electric Potential: the governing relation","paragraphs":["Electric potential is potential energy per charge: V = U/q. A potential difference has units joules per coulomb, called volts.","A charge moving across ΔV changes electric potential energy by qΔV. A negative charge reverses the energy-change sign relative to a positive charge."]},"memoryCue":{"title":"5.4 · Potential belongs to the field; energy also needs the charge.","paragraphs":["Potential belongs to the field; energy also needs the charge.","A charge moving across ΔV changes electric potential energy by qΔV. A negative charge reverses the energy-change sign relative to a positive charge."]},"traps":{"title":"5.4 · Check signs, assumptions and meaning","paragraphs":["For a uniform one-dimensional field, Ex = -ΔV/Δx. The field points toward decreasing potential, while force direction also depends on the sign of the charge.","Equipotential surfaces requ
