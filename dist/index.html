ision, a common reporting convention uses the fewest significant figures among measured inputs. For addition and subtraction, the limiting decimal place governs."]},"memoryCue":{"title":"10.1 · Products track significant figures; sums track decimal places.","paragraphs":["Products track significant figures; sums track decimal places.","For multiplication and division, a common reporting convention uses the fewest significant figures among measured inputs. For addition and subtraction, the limiting decimal place governs."]},"traps":{"title":"10.1 · Check signs, assumptions and meaning","paragraphs":["Exact counts and defined conversion factors do not impose the same significant-figure limit as uncertain measurements. Keep extra digits during intermediate work to reduce rounding error.","A final numerical value and its precision are different aspects of reporting. In this app, dedicated precision questions can require exact text while ordinary numerical questions assess value in a stated unit."]},"application":{"title":"10.1 · Apply the model within its limits","paragraphs":["A final numerical value and its precision are different aspects of reporting. In this app, dedicated precision questions can require exact text while ordinary numerical questions assess value in a stated unit.","The leading zeros do not count; 4, 5 and the terminal decimal zero do, giving three significant figures."]}},{"id":"concept-10-2","title":"Exponents and Logarithms","section":"10.2","asset":"ph10-02","steps":[{"text":"For a positive quantity, log10 returns the exponent of ten that produces it. Scientific notation separates a coefficient from its power-of-ten scale.","focus":["part-0"]},{"text":"Multiplication adds exponents and logarithms turn products into sums. A logarithm’s argument should be dimensionless, often formed as a ratio to a reference value.","focus":["part-1"]},{"text":"A change of one unit on a base-ten logarithmic scale represents a tenfold ratio. A negative logarithm is possible for a positive argument below one.","focus":["part-2"]},{"text":"Use order-of-magnitude estimates to check arithmetic. Be explicit whether an axis is linear or logarithmic before interpreting equal spacings.","focus":["part-3"]}],"coreRule":{"title":"10.2 · Exponents and Logarithms: the governing relation","paragraphs":["For a positive quantity, log10 returns the exponent of ten that produces it. Scientific notation separates a coefficient from its power-of-ten scale.","Multiplication adds exponents and logarithms turn products into sums. A logarithm’s argument should be dimensionless, often formed as a ratio to a reference value."]},"memoryCue":{"title":"10.2 · Logs turn ratios into differences and products into sums.","paragraphs":["Logs turn ratios into differences and products into sums.","Multiplication adds exponents and logarithms turn products into sums. A logarithm’s argument should be dimensionless, often formed as a ratio to a reference value."]},"traps":{"title":"10.2 · Check signs, assumptions and meaning","paragraphs":["A change of one unit on a base-ten logarithmic scale represents a tenfold ratio. A negative logarithm is possible for a positive argument below one.","Use order-of-magnitude estimates to check arithmetic. Be explicit whether an axis is linear or logarithmic before interpreting equal spacings."]},"application":{"title":"10.2 · Apply the model within its limits","paragraphs":["Use order-of-magnitude estimates to check arithmetic. Be explicit whether an axis is linear or logarithmic before interpreting equal spacings.","10³ = 1000, so log10(1000) = 3."]}},{"id":"concept-10-3","title":"Trigonometry","section":"10.3","asset":"ph10-03","steps":[{"text":"In a right triangle relative to angle θ, sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse and tan θ = opposite/adjacent.","focus":["part-0"]},{"text":"The hypotenuse lies opposite the right angle, not necessarily opposite the angle named in a problem. Side roles change when the reference acute angle changes.","focus":["part-1"]},{"text":"One full turn is 2π radians or 360°. Small-angle relations such as sin θ ≈ θ require θ in radians and are approximations, not exact identities at every angle.","focus":["part-2"]},{"text":"For components of a vector, identify the angle relative to the chosen axis before assigning sine or cosine. A diagram can make this decision clearer than a memorized word order.","focus":["part-3"]}],"coreRule":{"title":"10.3 · Trigonometry: the governing relation","paragraphs":["In a right triangle relative to angle θ, sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse and tan θ = opposite/adjacent.","The hypotenuse lies opposite the right angle, not necessarily opposite the angle named in a problem. Side roles change when the reference acute angle changes."]},"memoryCue":{"title":"10.3 · SOH-CAH-TOA works only after choosing the reference angle.","paragraphs":["SOH-CAH-TOA works only after choosing the reference angle.","The hypotenuse lies opposite the right angle, not necessarily opposite the angle named in a problem. Side roles change when the reference acute angle changes."]},"traps":{"title":"10.3 · Check signs, assumptions and meaning","paragraphs":["One full turn is 2π radians or 360°. Small-angle relations such as sin θ ≈ θ require θ in radians and are approximations, not exact identities at every angle.","For components of a vector, identify the angle relative to the chosen axis before assigning sine or cosine. A diagram can make this decision clearer than a memorized word order."]},"application":{"title":"10.3 · Apply the model within its limits","paragraphs":["For components of a vector, identify the angle relative to the chosen axis before assigning sine or cosine. A diagram can make this decision clearer than a memorized word order.","sin θ = opposite/hypotenuse = 3/5 = 0.6."]}},{"id":"concept-10-4","title":"Problem-Solving","section":"10.4","asset":"ph10-04","steps":[{"text":"Begin a quantitative problem by naming the target and listing given quantities with units. Choose a physical model before rearranging symbols.","focus":["part-0"]},{"text":"Write a symbolic relation, isolate the target and then substitute values. This preserves dependencies and makes unit cancellation easier to inspect.","focus":["part-1"]},{"text":"A plausible number is not sufficient if its unit, sign or limiting behavior is wrong. Check what the formula predicts as a relevant input approaches zero or becomes large.","focus":["part-2"]},{"text":"An approximation must match its regime: small-angle, nonrelativistic, ideal-fluid and constant-acceleration models each have different conditions. State the assumption that makes a shortcut legitimate.","focus":["part-3"]}],"coreRule":{"title":"10.4 · Problem-Solving: the governing relation","paragraphs":["Begin a quantitative problem by naming the target and listing given quantities with units. Choose a physical model before rearranging symbols.","Write a symbolic relation, isolate the target and then substitute values. This preserves dependencies and makes unit cancellation easier to inspect."]},"memoryCue":{"title":"10.4 · Model, symbols, numbers, then units and limits.","paragraphs":["Model, symbols, numbers, then units and limits.","Write a symbolic relation, isolate the target and then substitute values. This preserves dependencies and makes unit cancellation easier to inspect."]},"traps":{"title":"10.4 · Check signs, assumptions and meaning","paragraphs":["A plausible number is not sufficient if its unit, sign or limiting behavior is wrong. Check what the formula predicts as a relevant input approaches zero or becomes large.","An approximation must match its regime: small-angle, nonrelativistic, ideal-fluid and constant-acceleration models each have different conditions. State the assumption that makes a shortcut legitimate."]},"application":{"title":"10.4 · Apply the model within its limits","paragraphs":["An approximation must match its regime: small-angle, nonrelativistic, ideal-fluid and constant-acceleration models each have different conditions. State the assumption that makes a shortcut legitimate.","t = d/v = 45/3 = 15 s; units m divided by m/s give seconds."]}}],"exercises":[{"id":"ph-10-01-workshop-v1","title":"Arithmetic and Significant Figures","asset":"ph10-01","stages":[{"id":"map","type":"selection","prompt":"Select the criterion governing the reporting of a measured sum.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Decimal place. Reported precision should match the information available. Leading zeros locate a decimal point but do not count as significant digits; zeros between nonzero digits do count.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","For multiplication and division, a common reporting convention uses the fewest significant figures among measured inputs. For addition and subtraction, the limiting decimal place governs."]},{"type":"number","prompt":"How many significant figures are in the measured value 0.00450?","answer":3,"unit":"dimensionless","tolerance":0,"explanation":"The leading zeros do not count; 4, 5 and the terminal decimal zero do, giving three significant figures.","id":"reason","hints":["Reported precision should match the information available. Leading zeros locate a decimal point but do not count as significant digits; zeros between nonzero digits do count.","For multiplication and division, a common reporting convention uses the fewest significant figures among measured inputs. For addition and subtraction, the limiting decimal place governs."]},{"type":"choice","prompt":"A measured sum is 12.3 m + 0.45 m. Which reported result follows the decimal-place convention?","options":["12.8 m","12.75 m","13 m","12.750 m"],"answer":0,"explanation":"The sum is 12.75 m before rounding; the tenths-place limit gives 12.8 m.","id":"transfer","hints":["For multiplication and division, a common reporting convention uses the fewest significant figures among measured inputs. For addition and subtraction, the limiting decimal place governs.","Exact counts and defined conversion factors do not impose the same significant-figure limit as uncertain measurements. Keep extra digits during intermediate work to reduce rounding error."]}]},{"id":"ph-10-02-workshop-v1","title":"Exponents and Logarithms","asset":"ph10-02","stages":[{"id":"map","type":"selection","prompt":"Select the operation that recovers the exponent from a positive base-ten value.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Logarithm. For a positive quantity, log10 returns the exponent of ten that produces it. Scientific notation separates a coefficient from its power-of-ten scale.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Multiplication adds exponents and logarithms turn products into sums. A logarithm’s argument should be dimensionless, often formed as a ratio to a reference value."]},{"type":"number","prompt":"Find log10(1000).","answer":3,"unit":"dimensionless","tolerance":0,"explanation":"10³ = 1000, so log10(1000) = 3.","id":"reason","hints":["For a positive quantity, log10 returns the exponent of ten that produces it. Scientific notation separates a coefficient from its power-of-ten scale.","Multiplication adds exponents and logarithms turn products into sums. A logarithm’s argument should be dimensionless, often formed as a ratio to a reference value."]},{"type":"number","prompt":"Evaluate (2×10³)(3×10⁻²).","answer":60,"unit":"dimensionless","tolerance":0,"explanation":"Multiply coefficients and add exponents: 6×10¹ = 60.","id":"transfer","hints":["Multiplication adds exponents and logarithms turn products into sums. A logarithm’s argument should be dimensionless, often formed as a ratio to a reference value.","A change of one unit on a base-ten logarithmic scale represents a tenfold ratio. A negative logarithm is possible for a positive argument below one."]}]},{"id":"ph-10-03-workshop-v1","title":"Trigonometry","asset":"ph10-03","stages":[{"id":"map","type":"selection","prompt":"Select the side opposite the right angle.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Hypotenuse. In a right triangle relative to angle θ, sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse and tan θ = opposite/adjacent.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","The hypotenuse lies opposite the right angle, not necessarily opposite the angle named in a problem. Side roles change when the reference acute angle changes."]},{"type":"number","prompt":"A right triangle has opposite side 3 and hypotenuse 5 relative to θ. Find sin θ.","answer":0.6,"unit":"dimensionless","tolerance":0,"explanation":"sin θ = opposite/hypotenuse = 3/5 = 0.6.","id":"reason","hints":["In a right triangle relative to angle θ, sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse and tan θ = opposite/adjacent.","The hypotenuse lies opposite the right angle, not necessarily opposite the angle named in a problem. Side roles change when the reference acute angle changes."]},{"type":"number","prompt":"A right triangle has adjacent side 4 and opposite side 3 relative to θ. Find tan θ.","answer":0.75,"unit":"dimensionless","tolerance":0,"explanation":"tan θ = opposite/adjacent = 3/4 = 0.75.","id":"transfer","hints":["The hypotenuse lies opposite the right angle, not necessarily opposite the angle named in a problem. Side roles change when the reference acute angle changes.","One full turn is 2π radians or 360°. Small-angle relations such as sin θ ≈ θ require θ in radians and are approximations, not exact identities at every angle."]}]},{"id":"ph-10-04-workshop-v1","title":"Problem-Solving","asset":"ph10-04","stages":[{"id":"map","type":"selection","prompt":"Select the step that tests signs, dimensions and limiting behavior after a calculation.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Sanity check. Begin a quantitative problem by naming the target and listing given quantities with units. Choose a physical model before rearranging symbols.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Write a symbolic relation, isolate the target and then substitute values. This preserves dependencies and makes unit cancellation easier to inspect."]},{"type":"number","prompt":"A model gives t = d/v. For d = 45 m and v = 3 m/s, find t.","answer":15,"unit":"s","tolerance":0,"explanation":"t = d/v = 45/3 = 15 s; units m divided by m/s give seconds.","id":"reason","hints":["Begin a quantitative problem by naming the target and listing given quantities with units. Choose a physical model before rearranging symbols.","Write a symbolic relation, isolate the target and then substitute values. This preserves dependencies and makes unit cancellation easier to inspect."]},{"type":"choice","prompt":"A computed speed has units kg/s. What should happen next?","options":["Accept it if the digits look plausible","Rename kilograms as meters","Drop the units","Recheck the physical relation and unit cancellation"],"answer":3,"explanation":"Speed must have dimensions length/time; a dimensional mismatch reveals an inconsistent derivation or substitution.","id":"transfer","hints":["Write a symbolic relation, isolate the target and then substitute values. This preserves dependencies and makes unit cancellation easier to inspect.","A plausible number is not sufficient if its unit, sign or limiting behavior is wrong. Check what the formula predicts as a relevant input approaches zero or becomes large."]}]}]},{"version":1,"id":"chapter-11","title":"Reasoning About the Design and Execution of Research","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-11-1","title":"The Scientific Method","section":"11.1","asset":"ph11-01","steps":[{"text":"A scientific hypothesis is a testable explanation; a prediction is an expected observation under specified conditions. Evidence can constrain an explanation without proving it true for all possible cases.","focus":["part-0"]},{"text":"An experiment compares outcomes while controlling relevant conditions. A useful hypothesis makes predictions that could be contradicted by observations.","focus":["part-1"]},{"text":"Failure to reject a hypothesis is not proof of truth. Null results can arise from limited precision, low power or a genuinely small effect.","focus":["part-2"]},{"text":"Replication and revision are normal parts of inquiry. Distinguish an exploratory idea from a prespecified test when evaluating the strength of a claim.","focus":["part-3"]}],"coreRule":{"title":"11.1 · The Scientific Method: the governing relation","paragraphs":["A scientific hypothesis is a testable explanation; a prediction is an expected observation under specified conditions. Evidence can constrain an explanation without proving it true for all possible cases.","An experiment compares outcomes while controlling relevant conditions. A useful hypothesis makes predictions that could be contradicted by observations."]},"memoryCue":{"title":"11.1 · A testable claim must risk being contradicted.","paragraphs":["A testable claim must risk being contradicted.","An experiment compares outcomes while controlling relevant conditions. A useful hypothesis makes predictions that could be contradicted by observations."]},"traps":{"title":"11.1 · Check signs, assumptions and meaning","paragraphs":["Failure to reject a hypothesis is not proof of truth. Null results can arise from limited precision, low power or a genuinely small effect.","Replication and revision are normal parts of inquiry. Distinguish an exploratory idea from a prespecified test when evaluating the strength of a claim."]},"application":{"title":"11.1 · Apply the model within its limits","paragraphs":["Replication and revision are normal parts of inquiry. Distinguish an exploratory idea from a prespecified test when evaluating the strength of a claim.","The specified change in X and measured response in Y can be tested under controlled conditions."]}},{"id":"concept-11-2","title":"Basic Science Research","section":"11.2","asset":"ph11-02","steps":[{"text":"An experiment manipulates an independent variable and measures a dependent outcome. A control condition helps separate the tested change from background effects.","focus":["part-0"]},{"text":"A confounder is related to both exposure and outcome and can distort the apparent association. Holding conditions fixed, random assignment and appropriate analysis address different sources of bias.","focus":["part-1"]},{"text":"Random assignment allocates treatment and supports causal comparison within a study. Random sampling selects participants or units from a population and addresses a different generalization question.","focus":["part-2"]},{"text":"Biological replicates are distinct experimental units; repeated readings of one specimen are technical replicates. Treating all technical readings as independent can overstate precision.","focus":["part-3"]}],"coreRule":{"title":"11.2 · Basic Science Research: the governing relation","paragraphs":["An experiment manipulates an independent variable and measures a dependent outcome. A control condition helps separate the tested change from background effects.","A confounder is related to both exposure and outcome and can distort the apparent association. Holding conditions fixed, random assignment and appropriate analysis address different sources of bias."]},"memoryCue":{"title":"11.2 · Assignment supports group comparison; sampling supports population reach.","paragraphs":["Assignment supports group comparison; sampling supports population reach.","A confounder is related to both exposure and outcome and can distort the apparent association. Holding conditions fixed, random assignment and appropriate analysis address different sources of bias."]},"traps":{"title":"11.2 · Check signs, assumptions and meaning","paragraphs":["Random assignment allocates treatment and supports causal comparison within a study. Random sampling selects participants or units from a population and addresses a different generalization question.","Biological replicates are distinct experimental units; repeated readings of one specimen are technical replicates. Treating all technical readings as independent can overstate precision."]},"application":{"title":"11.2 · Apply the model within its limits","paragraphs":["Biological replicates are distinct experimental units; repeated readings of one specimen are technical replicates. Treating all technical readings as independent can overstate precision.","The dependent variable is the measured response: reaction time."]}},{"id":"concept-11-3","title":"Human Subjects Research","section":"11.3","asset":"ph11-03","steps":[{"text":"An interventional study assigns an exposure, whereas an observational study measures exposures without assigning them. Observational associations need careful treatment of confounding.","focus":["part-0"]},{"text":"Random assignment can reduce systematic baseline differences on average but does not guarantee perfect balance in every finite sample. Blinding addresses expectation and measurement biases.","focus":["part-1"]},{"text":"A cohort study follows groups defined by exposure; a case-control study selects on outcome status and compares prior exposures. These sampling choices affect which measures can be estimated directly.","focus":["part-2"]},{"text":"Study design alone does not guarantee validity. Loss to follow-up, adherence, outcome measurement and the population actually studied all affect interpretation.","focus":["part-3"]}],"coreRule":{"title":"11.3 · Human Subjects Research: the governing relation","paragraphs":["An interventional study assigns an exposure, whereas an observational study measures exposures without assigning them. Observational associations need careful treatment of confounding.","Random assignment can reduce systematic baseline differences on average but does not guarantee perfect balance in every finite sample. Blinding addresses expectation and measurement biases."]},"memoryCue":{"title":"11.3 · Randomize allocation; blind expectations; inspect follow-up.","paragraphs":["Randomize allocation; blind expectations; inspect follow-up.","Random assignment can reduce systematic baseline differences on average but does not guarantee perfect balance in every finite sample. Blinding addresses expectation and measurement biases."]},"traps":{"title":"11.3 · Check signs, assumptions and meaning","paragraphs":["A cohort study follows groups defined by exposure; a case-control study selects on outcome status and compares prior exposures. These sampling choices affect which measures can be estimated directly.","Study design alone does not guarantee validity. Loss to follow-up, adherence, outcome measurement and the population actually studied all affect interpretation."]},"application":{"title":"11.3 · Apply the model within its limits","paragraphs":["Study design alone does not guarantee validity. Loss to follow-up, adherence, outcome measurement and the population actually studied all affect interpretation.","Selecting participants by outcome status and comparing earlier exposures describes a case-control design."]}},{"id":"concept-11-4","title":"Ethics","section":"11.4","asset":"ph11-04","steps":[{"text":"Ethical research requires attention to voluntary informed consent, reasonable risk–benefit balance, privacy and fair participant selection. These are principles for evaluating a study, not a substitute for jurisdiction-specific rules.","focus":["part-0"]},{"text":"Consent is an ongoing process that supports understanding and choice. A signature alone does not establish comprehension or remove the need to respect withdrawal.","focus":["part-1"]},{"text":"Independent oversight reviews proposed research and safeguards. Scientific interest does not by itself justify avoidable harm or coercive recruitment.","focus":["part-2"]},{"text":"Protecting confidentiality differs from claiming that no identifying information was collected. Describe what data exist, who can access them and how risk is limited.","focus":["part-3"]}],"coreRule":{"title":"11.4 · Ethics: the governing relation","paragraphs":["Ethical research requires attention to voluntary informed consent, reasonable risk–benefit balance, privacy and fair participant selection. These are principles for evaluating a study, not a substitute for jurisdiction-specific rules.","Consent is an ongoing process that supports understanding and choice. A signature alone does not establish comprehension or remove the need to respect withdrawal."]},"memoryCue":{"title":"11.4 · Consent is understanding and choice, not just a signature.","paragraphs":["Consent is understanding and choice, not just a signature.","Consent is an ongoing process that supports understanding and choice. A signature alone does not establish comprehension or remove the need to respect withdrawal."]},"traps":{"title":"11.4 · Check signs, assumptions and meaning","paragraphs":["Independent oversight reviews proposed research and safeguards. Scientific interest does not by itself justify avoidable harm or coercive recruitment.","Protecting confidentiality differs from claiming that no identifying information was collected. Describe what data exist, who can access them and how risk is limited."]},"application":{"title":"11.4 · Apply the model within its limits","paragraphs":["Protecting confidentiality differs from claiming that no identifying information was collected. Describe what data exist, who can access them and how risk is limited.","Consent supports informed voluntary choice through understandable disclosure and opportunity to ask questions."]}},{"id":"concept-11-5","title":"Research in the Real World","section":"11.5","asset":"ph11-05","steps":[{"text":"Internal validity concerns whether a study’s conclusions hold for its studied comparison. External validity concerns applicability to other populations, settings and conditions.","focus":["part-0"]},{"text":"A statistically detectable effect can be too small to matter practically. Consider absolute change, uncertainty, baseline risk and costs rather than relying only on a p-value.","focus":["part-1"]},{"text":"Selective reporting and publication patterns can distort the apparent literature. Prespecified outcomes, transparent methods and replication improve interpretability but do not guarantee correctness.","focus":["part-2"]},{"text":"Translation to practice depends on feasibility, adherence, context and competing evidence. A laboratory mechanism or single trial is one contribution to a broader evidence base.","focus":["part-3"]}],"coreRule":{"title":"11.5 · Research in the Real World: the governing relation","paragraphs":["Internal validity concerns whether a study’s conclusions hold for its studied comparison. External validity concerns applicability to other populations, settings and conditions.","A statistically detectable effect can be too small to matter practically. Consider absolute change, uncertainty, baseline risk and costs rather than relying only on a p-value."]},"memoryCue":{"title":"11.5 · Ask whether the effect is credible, meaningful and transferable.","paragraphs":["Ask whether the effect is credible, meaningful and transferable.","A statistically detectable effect can be too small to matter practically. Consider absolute change, uncertainty, baseline risk and costs rather than relying only on a p-value."]},"traps":{"title":"11.5 · Check signs, assumptions and meaning","paragraphs":["Selective reporting and publication patterns can distort the apparent literature. Prespecified outcomes, transparent methods and replication improve interpretability but do not guarantee correctness.","Translation to practice depends on feasibility, adherence, context and competing evidence. A laboratory mechanism or single trial is one contribution to a broader evidence base."]},"application":{"title":"11.5 · Apply the model within its limits","paragraphs":["Translation to practice depends on feasibility, adherence, context and competing evidence. A laboratory mechanism or single trial is one contribution to a broader evidence base.","Absolute reduction = 0.20 - 0.15 = 0.05, or 5 percentage points."]}}],"exercises":[{"id":"ph-11-01-workshop-v1","title":"The Scientific Method","asset":"ph11-01","stages":[{"id":"map","type":"selection","prompt":"Select the proposed explanation that motivates testable predictions.","answer":["part-0"],"explanation":"The relevant diagram entity or entities are Hypothesis. A scientific hypothesis is a testable explanation; a prediction is an expected observation under specified conditions. Evidence can constrain an explanation without proving it true for all possible cases.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","An experiment compares outcomes while controlling relevant conditions. A useful hypothesis makes predictions that could be contradicted by observations."]},{"type":"choice","prompt":"Which statement is most directly a testable prediction?","options":["Doubling X will increase measured Y under specified conditions","The explanation is beyond all observation","Any possible result confirms the idea","The result is correct because it is familiar"],"answer":0,"explanation":"The specified change in X and measured response in Y can be tested under controlled conditions.","id":"reason","hints":["A scientific hypothesis is a testable explanation; a prediction is an expected observation under specified conditions. Evidence can constrain an explanation without proving it true for all possible cases.","An experiment compares outcomes while controlling relevant conditions. A useful hypothesis makes predictions that could be contradicted by observations."]},{"type":"choice","prompt":"An experiment fails to reject its null hypothesis. What follows?","options":["The null has been proven universally true","The data do not establish rejection under the chosen test","The experiment must be fraudulent","The alternative is necessarily impossible"],"answer":1,"explanation":"A nonrejection can reflect insufficient evidence or limited power; it is not proof of no effect.","id":"transfer","hints":["An experiment compares outcomes while controlling relevant conditions. A useful hypothesis makes predictions that could be contradicted by observations.","Failure to reject a hypothesis is not proof of truth. Null results can arise from limited precision, low power or a genuinely small effect."]}]},{"id":"ph-11-02-workshop-v1","title":"Basic Science Research","asset":"ph11-02","stages":[{"id":"map","type":"selection","prompt":"Select the factor that can distort an exposure–outcome association when linked to both.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Confounder. An experiment manipulates an independent variable and measures a dependent outcome. A control condition helps separate the tested change from background effects.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A confounder is related to both exposure and outcome and can distort the apparent association. Holding conditions fixed, random assignment and appropriate analysis address different sources of bias."]},{"type":"choice","prompt":"An experiment changes solution temperature and measures reaction time. What is the dependent variable?","options":["Assigned temperature","Reaction time","The investigator’s hypothesis","The name of the instrument"],"answer":1,"explanation":"The dependent variable is the measured response: reaction time.","id":"reason","hints":["An experiment manipulates an independent variable and measures a dependent outcome. A control condition helps separate the tested change from background effects.","A confounder is related to both exposure and outcome and can distort the apparent association. Holding conditions fixed, random assignment and appropriate analysis address different sources of bias."]},{"type":"choice","prompt":"Ten readings are taken from one biological specimen. What are those repeated readings?","options":["Ten independent organisms","Randomly sampled people","Technical replicates","Ten separate clinical trials"],"answer":2,"explanation":"Repeated measurement of the same specimen is technical replication, not ten independent biological units.","id":"transfer","hints":["A confounder is related to both exposure and outcome and can distort the apparent association. Holding conditions fixed, random assignment and appropriate analysis address different sources of bias.","Random assignment allocates treatment and supports causal comparison within a study. Random sampling selects participants or units from a population and addresses a different generalization question."]}]},{"id":"ph-11-03-workshop-v1","title":"Human Subjects Research","asset":"ph11-03","stages":[{"id":"map","type":"selection","prompt":"Select the design feature allocating participants to intervention groups by chance.","answer":["part-0"],"explanation":"The relevant diagram entity or entities are Random assignment. An interventional study assigns an exposure, whereas an observational study measures exposures without assigning them. Observational associations need careful treatment of confounding.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Random assignment can reduce systematic baseline differences on average but does not guarantee perfect balance in every finite sample. Blinding addresses expectation and measurement biases."]},{"type":"choice","prompt":"A study selects people with and without a disease, then compares prior exposures. Which design is this?","options":["A cohort defined initially only by exposure","A randomized trial by definition","Case-control","A single uncontrolled laboratory assay"],"answer":2,"explanation":"Selecting participants by outcome status and comparing earlier exposures describes a case-control design.","id":"reason","hints":["An interventional study assigns an exposure, whereas an observational study measures exposures without assigning them. Observational associations need careful treatment of confounding.","Random assignment can reduce systematic baseline differences on average but does not guarantee perfect balance in every finite sample. Blinding addresses expectation and measurement biases."]},{"type":"choice","prompt":"What does blinded outcome assessment primarily help reduce?","options":["Every possible confounder automatically","The need for consent","All random sampling error","Expectation-related measurement bias"],"answer":3,"explanation":"Blinding limits the influence of knowledge of assignment on measurement or judgment; it does not eliminate every source of bias.","id":"transfer","hints":["Random assignment can reduce systematic baseline differences on average but does not guarantee perfect balance in every finite sample. Blinding addresses expectation and measurement biases.","A cohort study follows groups defined by exposure; a case-control study selects on outcome status and compares prior exposures. These sampling choices affect which measures can be estimated directly."]}]},{"id":"ph-11-04-workshop-v1","title":"Ethics","asset":"ph11-04","stages":[{"id":"map","type":"selection","prompt":"Select the principle concerned with distributing participation opportunities and burdens fairly.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Fair selection. Ethical research requires attention to voluntary informed consent, reasonable risk–benefit balance, privacy and fair participant selection. These are principles for evaluating a study, not a substitute for jurisdiction-specific rules.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Consent is an ongoing process that supports understanding and choice. A signature alone does not establish comprehension or remove the need to respect withdrawal."]},{"type":"choice","prompt":"Which practice best supports informed consent?","options":["Promise that research has no possible risks","Replace explanation with a signature alone","Make participation a condition for unrelated essential services","Explain relevant risks and voluntary participation in understandable terms"],"answer":3,"explanation":"Consent supports informed voluntary choice through understandable disclosure and opportunity to ask questions.","id":"reason","hints":["Ethical research requires attention to voluntary informed consent, reasonable risk–benefit balance, privacy and fair participant selection. These are principles for evaluating a study, not a substitute for jurisdiction-specific rules.","Consent is an ongoing process that supports understanding and choice. A signature alone does not establish comprehension or remove the need to respect withdrawal."]},{"type":"choice","prompt":"Identifiable data are collected but access is restricted. Which description is most appropriate?","options":["Confidentiality measures protect identified data","The study is automatically anonymous","No privacy risk can remain","Consent is unnecessary by definition"],"answer":0,"explanation":"Restricted access is a confidentiality safeguard; collection of identifiers means anonymity should not be claimed.","id":"transfer","hints":["Consent is an ongoing process that supports understanding and choice. A signature alone does not establish comprehension or remove the need to respect withdrawal.","Independent oversight reviews proposed research and safeguards. Scientific interest does not by itself justify avoidable harm or coercive recruitment."]}]},{"id":"ph-11-05-workshop-v1","title":"Research in the Real World","asset":"ph11-05","stages":[{"id":"map","type":"selection","prompt":"Select the population to which a user hopes to apply the study’s findings.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Target population. Internal validity concerns whether a study’s conclusions hold for its studied comparison. External validity concerns applicability to other populations, settings and conditions.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A statistically detectable effect can be too small to matter practically. Consider absolute change, uncertainty, baseline risk and costs rather than relying only on a p-value."]},{"type":"number","prompt":"A hypothetical intervention lowers event risk from 0.20 to 0.15. Find the absolute risk reduction as a fraction.","answer":0.05,"unit":"dimensionless","tolerance":0.000001,"explanation":"Absolute reduction = 0.20 - 0.15 = 0.05, or 5 percentage points.","id":"reason","hints":["Internal validity concerns whether a study’s conclusions hold for its studied comparison. External validity concerns applicability to other populations, settings and conditions.","A statistically detectable effect can be too small to matter practically. Consider absolute change, uncertainty, baseline risk and costs rather than relying only on a p-value."]},{"type":"choice","prompt":"A well-run study enrolls only one narrow population. What requires additional support?","options":["Its existence as a study","Generalization to different populations","That it measured any outcome","That its authors can report a sample size"],"answer":1,"explanation":"External validity depends on how the studied population and setting relate to the intended target.","id":"transfer","hints":["A statistically detectable effect can be too small to matter practically. Consider absolute change, uncertainty, baseline risk and costs rather than relying only on a p-value.","Selective reporting and publication patterns can distort the apparent literature. Prespecified outcomes, transparent methods and replication improve interpretability but do not guarantee correctness."]}]}]},{"version":1,"id":"chapter-12","title":"Data-Based and Statistical Reasoning","status":"implemented","scopeNote":"Original condensed MCAT Physics, Mathematics and Research Reasoning lessons. Models and calculations use stated assumptions. Independent scientific review is pending; this is not exhaustive textbook coverage.","lessons":[{"id":"concept-12-1","title":"Measures of Central Tendency","section":"12.1","asset":"ph12-01","steps":[{"text":"The arithmetic mean is the sum divided by count. The median is the middle ordered value, averaging the two middle values for an even count; the mode is the most frequent value.","focus":["part-0"]},{"text":"The mean is sensitive to extreme values, while the median is often more robust. A distribution need not have exactly one mode.","focus":["part-1"]},{"text":"Do not average subgroup means without considering subgroup sizes. A combined mean requires weighting by the number of observations represented by each mean.","focus":["part-2"]},{"text":"Choose a summary that fits the question and distribution. A central tendency alone does not describe variability, skewness or the uncertainty of a population estimate.","focus":["part-3"]}],"coreRule":{"title":"12.1 · Measures of Central Tendency: the governing relation","paragraphs":["The arithmetic mean is the sum divided by count. The median is the middle ordered value, averaging the two middle values for an even count; the mode is the most frequent value.","The mean is sensitive to extreme values, while the median is often more robust. A distribution need not have exactly one mode."]},"memoryCue":{"title":"12.1 · Mean shares the total; median finds the ordered middle.","paragraphs":["Mean shares the total; median finds the ordered middle.","The mean is sensitive to extreme values, while the median is often more robust. A distribution need not have exactly one mode."]},"traps":{"title":"12.1 · Check signs, assumptions and meaning","paragraphs":["Do not average subgroup means without considering subgroup sizes. A combined mean requires weighting by the number of observations represented by each mean.","Choose a summary that fits the question and distribution. A central tendency alone does not describe variability, skewness or the uncertainty of a population estimate."]},"application":{"title":"12.1 · Apply the model within its limits","paragraphs":["Choose a summary that fits the question and distribution. A central tendency alone does not describe variability, skewness or the uncertainty of a population estimate.","The sum is 20 across four values, so mean = 20/4 = 5."]}},{"id":"concept-12-2","title":"Distributions","section":"12.2","asset":"ph12-02","steps":[{"text":"A distribution describes how values or probabilities are spread. In a continuous probability density, probability corresponds to area over an interval, not the height at one point alone.","focus":["part-0"]},{"text":"A normal distribution is symmetric and specified by mean and standard deviation. For an exact normal model, about 68%, 95% and 99.7% lie within one, two and three standard deviations of the mean.","focus":["part-1"]},{"text":"Right-skewed distributions have a long right tail; left-skewed distributions have a long left tail. Symmetry does not by itself prove a distribution is normal.","focus":["part-2"]},{"text":"A standard score z = (x - μ)/σ places a value relative to a specified distribution. This describes standard-deviation units, not a direct probability without a distribution model.","focus":["part-3"]}],"coreRule":{"title":"12.2 · Distributions: the governing relation","paragraphs":["A distribution describes how values or probabilities are spread. In a continuous probability density, probability corresponds to area over an interval, not the height at one point alone.","A normal distribution is symmetric and specified by mean and standard deviation. For an exact normal model, about 68%, 95% and 99.7% lie within one, two and three standard deviations of the mean."]},"memoryCue":{"title":"12.2 · A density’s area is probability; its height alone is not.","paragraphs":["A density’s area is probability; its height alone is not.","A normal distribution is symmetric and specified by mean and standard deviation. For an exact normal model, about 68%, 95% and 99.7% lie within one, two and three standard deviations of the mean."]},"traps":{"title":"12.2 · Check signs, assumptions and meaning","paragraphs":["Right-skewed distributions have a long right tail; left-skewed distributions have a long left tail. Symmetry does not by itself prove a distribution is normal.","A standard score z = (x - μ)/σ places a value relative to a specified distribution. This describes standard-deviation units, not a direct probability without a distribution model."]},"application":{"title":"12.2 · Apply the model within its limits","paragraphs":["A standard score z = (x - μ)/σ places a value relative to a specified distribution. This describes standard-deviation units, not a direct probability without a distribution model.","The observation is two standard deviations above the mean: z = (60 - 50)/5 = +2."]}},{"id":"concept-12-3","title":"Measures of Distribution","section":"12.3","asset":"ph12-03","steps":[{"text":"Variance measures squared deviations from a center, and standard deviation is its square root. Standard deviation has the original data units; variance has squared units.","focus":["part-0"]},{"text":"For independent identically distributed observations with finite variance, the standard error of a sample mean is σ/√n, often estimated by s/√n.","focus":["part-1"]},{"text":"Standard deviation describes spread of observations, while standard error describes sampling variability of an estimator. A large sample can narrow mean uncertainty without shrinking individual variability.","focus":["part-2"]},{"text":"For a fixed positive data scale factor c, standard deviation scales by c and variance by c². Adding a constant shifts location without changing either measure of spread.","focus":["part-3"]}],"coreRule":{"title":"12.3 · Measures of Distribution: the governing relation","paragraphs":["Variance measures squared deviations from a center, and standard deviation is its square root. Standard deviation has the original data units; variance has squared units.","For independent identically distributed observations with finite variance, the standard error of a sample mean is σ/√n, often estimated by s/√n."]},"memoryCue":{"title":"12.3 · SD describes observations; SE describes an estimate’s repeated-sample variation.","paragraphs":["SD describes observations; SE describes an estimate’s repeated-sample variation.","For independent identically distributed observations with finite variance, the standard error of a sample mean is σ/√n, often estimated by s/√n."]},"traps":{"title":"12.3 · Check signs, assumptions and meaning","paragraphs":["Standard deviation describes spread of observations, while standard error describes sampling variability of an estimator. A large sample can narrow mean uncertainty without shrinking individual variability.","For a fixed positive data scale factor c, standard deviation scales by c and variance by c². Adding a constant shifts location without changing either measure of spread."]},"application":{"title":"12.3 · Apply the model within its limits","paragraphs":["For a fixed positive data scale factor c, standard deviation scales by c and variance by c². Adding a constant shifts location without changing either measure of spread.","SEmean = s/√n = 12/6 = 2 units."]}},{"id":"concept-12-4","title":"Probability","section":"12.4","asset":"ph12-04","steps":[{"text":"Probability ranges from zero to one. For any events, P(A or B) = P(A) + P(B) - P(A and B), so overlapping outcomes are not counted twice.","focus":["part-0"]},{"text":"For independent events, P(A and B) = P(A)P(B). Independence differs from mutual exclusivity; two positive-probability exclusive events are not independent.","focus":["part-1"]},{"text":"Conditional probability P(A|B) = P(A and B)/P(B) when P(B) is positive. Reversing the condition generally changes the answer.","focus":["part-2"]},{"text":"Diagnostic interpretation depends on prevalence as well as sensitivity and specificity. A positive result is not automatically the same probability as sensitivity.","focus":["part-3"]}],"coreRule":{"title":"12.4 · Probability: the governing relation","paragraphs":["Probability ranges from zero to one. For any events, P(A or B) = P(A) + P(B) - P(A and B), so overlapping outcomes are not counted twice.","For independent events, P(A and B) = P(A)P(B). Independence differs from mutual exclusivity; two positive-probability exclusive events are not independent."]},"memoryCue":{"title":"12.4 · Given B means restrict the denominator to B.","paragraphs":["Given B means restrict the denominator to B.","For independent events, P(A and B) = P(A)P(B). Independence differs from mutual exclusivity; two positive-probability exclusive events are not independent."]},"traps":{"title":"12.4 · Check signs, assumptions and meaning","paragraphs":["Conditional probability P(A|B) = P(A and B)/P(B) when P(B) is positive. Reversing the condition generally changes the answer.","Diagnostic interpretation depends on prevalence as well as sensitivity and specificity. A positive result is not automatically the same probability as sensitivity."]},"application":{"title":"12.4 · Apply the model within its limits","paragraphs":["Diagnostic interpretation depends on prevalence as well as sensitivity and specificity. A positive result is not automatically the same probability as sensitivity.","Independence permits multiplication: 0.4 × 0.5 = 0.20."]}},{"id":"concept-12-5","title":"Statistical Testing","section":"12.5","asset":"ph12-05","steps":[{"text":"A statistical test evaluates evidence against a specified null model using a statistic and assumptions. Prespecifying a significance level helps define the decision rule.","focus":["part-0"]},{"text":"A p-value is the probability, under the null model and assumptions, of data at least as incompatible with the null as the observed statistic. It is not the probability that the null is true.","focus":["part-1"]},{"text":"A Type I error rejects a true null; a Type II error fails to reject a false null. Power is one minus the Type II error probability for a stated alternative.","focus":["part-2"]},{"text":"Statistical significance does not determine effect importance, eliminate confounding or prove a causal mechanism. Confidence intervals describe uncertainty under their model and sampling procedure.","focus":["part-3"]}],"coreRule":{"title":"12.5 · Statistical Testing: the governing relation","paragraphs":["A statistical test evaluates evidence against a specified null model using a statistic and assumptions. Prespecifying a significance level helps define the decision rule.","A p-value is the probability, under the null model and assumptions, of data at least as incompatible with the null as the observed statistic. It is not the probability that the null is true."]},"memoryCue":{"title":"12.5 · A small p-value challenges the null model, not directly the null’s probability.","paragraphs":["A small p-value challenges the null model, not directly the null’s probability.","A p-value is the probability, under the null model and assumptions, of data at least as incompatible with the null as the observed statistic. It is not the probability that the null is true."]},"traps":{"title":"12.5 · Check signs, assumptions and meaning","paragraphs":["A Type I error rejects a true null; a Type II error fails to reject a false null. Power is one minus the Type II error probability for a stated alternative.","Statistical significance does not determine effect importance, eliminate confounding or prove a causal mechanism. Confidence intervals describe uncertainty under their model and sampling procedure."]},"application":{"title":"12.5 · Apply the model within its limits","paragraphs":["Statistical significance does not determine effect importance, eliminate confounding or prove a causal mechanism. Confidence intervals describe uncertainty under their model and sampling procedure.","Power = 1 - β = 1 - 0.20 = 0.80."]}},{"id":"concept-12-6","title":"Charts, Graphs, and Tables","section":"12.6","asset":"ph12-06","steps":[{"text":"Read axis variables, units, scales and legend before comparing data. A truncated axis or logarithmic scale can change visual impressions without changing the underlying values.","focus":["part-0"]},{"text":"A slope is change in vertical quantity divided by change in horizontal quantity. Its units come from that ratio, not from the visual angle of a line on a rescaled page.","focus":["part-1"]},{"text":"Error bars can represent standard deviation, standard error or a confidence interval. Their meaning must be specified; overlap alone is not a universal significance test.","focus":["part-2"]},{"text":"A trend in a scatterplot shows association, not a causal mechanism by itself. Tables can provide exact values when a graphic is designed chiefly to display patterns.","focus":["part-3"]}],"coreRule":{"title":"12.6 · Charts, Graphs, and Tables: the governing relation","paragraphs":["Read axis variables, units, scales and legend before comparing data. A truncated axis or logarithmic scale can change visual impressions without changing the underlying values.","A slope is change in vertical quantity divided by change in horizontal quantity. Its units come from that ratio, not from the visual angle of a line on a rescaled page."]},"memoryCue":{"title":"12.6 · Axes, units, scale, then pattern.","paragraphs":["Axes, units, scale, then pattern.","A slope is change in vertical quantity divided by change in horizontal quantity. Its units come from that ratio, not from the visual angle of a line on a rescaled page."]},"traps":{"title":"12.6 · Check signs, assumptions and meaning","paragraphs":["Error bars can represent standard deviation, standard error or a confidence interval. Their meaning must be specified; overlap alone is not a universal significance test.","A trend in a scatterplot shows association, not a causal mechanism by itself. Tables can provide exact values when a graphic is designed chiefly to display patterns."]},"application":{"title":"12.6 · Apply the model within its limits","paragraphs":["A trend in a scatterplot shows association, not a causal mechanism by itself. Tables can provide exact values when a graphic is designed chiefly to display patterns.","Slope = (14 - 2)/(5 - 1) = 12/4 = 3 m/s."]}},{"id":"concept-12-7","title":"Applying Data","section":"12.7","asset":"ph12-07","steps":[{"text":"Applying data requires matching a claim to the study design, measurement and population. A precise estimate can still be biased if the underlying comparison is flawed.","focus":["part-0"]},{"text":"Relative and absolute effects answer different questions. Reducing risk from 0.02 to 0.01 is a 50% relative reduction but only a 0.01 absolute reduction.","focus":["part-1"]},{"text":"Check denominators, missing data and uncertainty before comparing groups. A subgroup pattern can differ from an aggregate pattern when group composition changes.","focus":["part-2"]},{"text":"A defensible conclusion states what was measured, how uncertain it is and what alternatives remain. Correlation, significance and plausibility do not individually prove causation.","focus":["part-3"]}],"coreRule":{"title":"12.7 · Applying Data: the governing relation","paragraphs":["Applying data requires matching a claim to the study design, measurement and population. A precise estimate can still be biased if the underlying comparison is flawed.","Relative and absolute effects answer different questions. Reducing risk from 0.02 to 0.01 is a 50% relative reduction but only a 0.01 absolute reduction."]},"memoryCue":{"title":"12.7 · Name the denominator and limit the conclusion to the design.","paragraphs":["Name the denominator and limit the conclusion to the design.","Relative and absolute effects answer different questions. Reducing risk from 0.02 to 0.01 is a 50% relative reduction but only a 0.01 absolute reduction."]},"traps":{"title":"12.7 · Check signs, assumptions and meaning","paragraphs":["Check denominators, missing data and uncertainty before comparing groups. A subgroup pattern can differ from an aggregate pattern when group composition changes.","A defensible conclusion states what was measured, how uncertain it is and what alternatives remain. Correlation, significance and plausibility do not individually prove causation."]},"application":{"title":"12.7 · Apply the model within its limits","paragraphs":["A defensible conclusion states what was measured, how uncertain it is and what alternatives remain. Correlation, significance and plausibility do not individually prove causation.","Relative reduction = (0.02 - 0.01)/0.02 = 0.5."]}}],"exercises":[{"id":"ph-12-01-workshop-v1","title":"Measures of Central Tendency","asset":"ph12-01","stages":[{"id":"map","type":"selection","prompt":"Select the summary usually less affected than the mean by one extreme value.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Median. The arithmetic mean is the sum divided by count. The median is the middle ordered value, averaging the two middle values for an even count; the mode is the most frequent value.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","The mean is sensitive to extreme values, while the median is often more robust. A distribution need not have exactly one mode."]},{"type":"number","prompt":"Find the arithmetic mean of 2, 4, 6 and 8.","answer":5,"unit":"dimensionless","tolerance":0,"explanation":"The sum is 20 across four values, so mean = 20/4 = 5.","id":"reason","hints":["The arithmetic mean is the sum divided by count. The median is the middle ordered value, averaging the two middle values for an even count; the mode is the most frequent value.","The mean is sensitive to extreme values, while the median is often more robust. A distribution need not have exactly one mode."]},{"type":"number","prompt":"Find the median of 1, 2, 3, 4 and 100.","answer":3,"unit":"dimensionless","tolerance":0,"explanation":"The ordered list has five values; the third value is the median, 3.","id":"transfer","hints":["The mean is sensitive to extreme values, while the median is often more robust. A distribution need not have exactly one mode.","Do not average subgroup means without considering subgroup sizes. A combined mean requires weighting by the number of observations represented by each mean."]}]},{"id":"ph-12-02-workshop-v1","title":"Distributions","asset":"ph12-02","stages":[{"id":"map","type":"selection","prompt":"Select the feature interpreted as probability in a continuous-density model.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Probability area. A distribution describes how values or probabilities are spread. In a continuous probability density, probability corresponds to area over an interval, not the height at one point alone.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A normal distribution is symmetric and specified by mean and standard deviation. For an exact normal model, about 68%, 95% and 99.7% lie within one, two and three standard deviations of the mean."]},{"type":"number","prompt":"For μ = 50 and σ = 5, find the z score of x = 60.","answer":2,"unit":"dimensionless","tolerance":0,"explanation":"The observation is two standard deviations above the mean: z = (60 - 50)/5 = +2.","id":"reason","hints":["A distribution describes how values or probabilities are spread. In a continuous probability density, probability corresponds to area over an interval, not the height at one point alone.","A normal distribution is symmetric and specified by mean and standard deviation. For an exact normal model, about 68%, 95% and 99.7% lie within one, two and three standard deviations of the mean."]},{"type":"choice","prompt":"A distribution has a long tail extending to large positive values. Which description fits?","options":["Left-skewed by definition","Necessarily normal","Uniform by definition","Right-skewed"],"answer":3,"explanation":"Skew direction names the long tail, so a long high-value tail is right skew.","id":"transfer","hints":["A normal distribution is symmetric and specified by mean and standard deviation. For an exact normal model, about 68%, 95% and 99.7% lie within one, two and three standard deviations of the mean.","Right-skewed distributions have a long right tail; left-skewed distributions have a long left tail. Symmetry does not by itself prove a distribution is normal."]}]},{"id":"ph-12-03-workshop-v1","title":"Measures of Distribution","asset":"ph12-03","stages":[{"id":"map","type":"selection","prompt":"Select the quantity shrinking as 1/√n under the stated independent-sample mean model.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Standard error. Variance measures squared deviations from a center, and standard deviation is its square root. Standard deviation has the original data units; variance has squared units.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","For independent identically distributed observations with finite variance, the standard error of a sample mean is σ/√n, often estimated by s/√n."]},{"type":"number","prompt":"A sample has s = 12 units and n = 36 independent observations. Find the estimated standard error of its mean.","answer":2,"unit":"units","tolerance":0,"explanation":"SEmean = s/√n = 12/6 = 2 units.","id":"reason","hints":["Variance measures squared deviations from a center, and standard deviation is its square root. Standard deviation has the original data units; variance has squared units.","For independent identically distributed observations with finite variance, the standard error of a sample mean is σ/√n, often estimated by s/√n."]},{"type":"number","prompt":"All observations are multiplied by 3. By what factor does their variance change?","answer":9,"unit":"dimensionless","tolerance":0,"explanation":"Variance scales with the square of the multiplier, so the factor is 3² = 9.","id":"transfer","hints":["For independent identically distributed observations with finite variance, the standard error of a sample mean is σ/√n, often estimated by s/√n.","Standard deviation describes spread of observations, while standard error describes sampling variability of an estimator. A large sample can narrow mean uncertainty without shrinking individual variability."]}]},{"id":"ph-12-04-workshop-v1","title":"Probability","asset":"ph12-04","stages":[{"id":"map","type":"selection","prompt":"Select the outcomes belonging to both A and B.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Intersection. Probability ranges from zero to one. For any events, P(A or B) = P(A) + P(B) - P(A and B), so overlapping outcomes are not counted twice.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","For independent events, P(A and B) = P(A)P(B). Independence differs from mutual exclusivity; two positive-probability exclusive events are not independent."]},{"type":"number","prompt":"Independent events have P(A) = 0.4 and P(B) = 0.5. Find P(A and B).","answer":0.2,"unit":"dimensionless","tolerance":0,"explanation":"Independence permits multiplication: 0.4 × 0.5 = 0.20.","id":"reason","hints":["Probability ranges from zero to one. For any events, P(A or B) = P(A) + P(B) - P(A and B), so overlapping outcomes are not counted twice.","For independent events, P(A and B) = P(A)P(B). Independence differs from mutual exclusivity; two positive-probability exclusive events are not independent."]},{"type":"number","prompt":"P(A and B) = 0.12 and P(B) = 0.30. Find P(A|B).","answer":0.4,"unit":"dimensionless","tolerance":0.000001,"explanation":"Conditioning on B changes the denominator to P(B), giving P(A|B) = 0.12/0.30 = 0.4.","id":"transfer","hints":["For independent events, P(A and B) = P(A)P(B). Independence differs from mutual exclusivity; two positive-probability exclusive events are not independent.","Conditional probability P(A|B) = P(A and B)/P(B) when P(B) is positive. Reversing the condition generally changes the answer."]}]},{"id":"ph-12-05-workshop-v1","title":"Statistical Testing","asset":"ph12-05","stages":[{"id":"map","type":"selection","prompt":"Select the set of statistic values triggering rejection under the chosen decision rule.","answer":["part-2"],"explanation":"The relevant diagram entity or entities are Rejection region. A statistical test evaluates evidence against a specified null model using a statistic and assumptions. Prespecifying a significance level helps define the decision rule.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A p-value is the probability, under the null model and assumptions, of data at least as incompatible with the null as the observed statistic. It is not the probability that the null is true."]},{"type":"number","prompt":"For a stated alternative, β = 0.20. Find statistical power.","answer":0.8,"unit":"dimensionless","tolerance":0.000001,"explanation":"Power = 1 - β = 1 - 0.20 = 0.80.","id":"reason","hints":["A statistical test evaluates evidence against a specified null model using a statistic and assumptions. Prespecifying a significance level helps define the decision rule.","A p-value is the probability, under the null model and assumptions, of data at least as incompatible with the null as the observed statistic. It is not the probability that the null is true."]},{"type":"choice","prompt":"A test rejects a null hypothesis that is actually true. What error occurred?","options":["Type II","No possible error","Type I","A sampling frame"],"answer":2,"explanation":"Rejecting a true null is a Type I error; nonrejection of a false null is Type II.","id":"transfer","hints":["A p-value is the probability, under the null model and assumptions, of data at least as incompatible with the null as the observed statistic. It is not the probability that the null is true.","A Type I error rejects a true null; a Type II error fails to reject a false null. Power is one minus the Type II error probability for a stated alternative."]}]},{"id":"ph-12-06-workshop-v1","title":"Charts, Graphs, and Tables","asset":"ph12-06","stages":[{"id":"map","type":"selection","prompt":"Select the visual element whose definition is required before interpreting statistical uncertainty.","answer":["part-3"],"explanation":"The relevant diagram entity or entities are Uncertainty bars. Read axis variables, units, scales and legend before comparing data. A truncated axis or logarithmic scale can change visual impressions without changing the underlying values.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","A slope is change in vertical quantity divided by change in horizontal quantity. Its units come from that ratio, not from the visual angle of a line on a rescaled page."]},{"type":"number","prompt":"On a position-time plot, position rises from 2 m at 1 s to 14 m at 5 s along a straight segment. Find the slope.","answer":3,"unit":"m/s","tolerance":0,"explanation":"Slope = (14 - 2)/(5 - 1) = 12/4 = 3 m/s.","id":"reason","hints":["Read axis variables, units, scales and legend before comparing data. A truncated axis or logarithmic scale can change visual impressions without changing the underlying values.","A slope is change in vertical quantity divided by change in horizontal quantity. Its units come from that ratio, not from the visual angle of a line on a rescaled page."]},{"type":"choice","prompt":"A figure shows error bars without defining them. What is justified?","options":["They must be 95% confidence intervals","They always equal standard deviation","They prove every group difference significant","Their statistical interpretation is not established"],"answer":3,"explanation":"Without the legend or methods, the bars could indicate different quantities and cannot be assigned a specific interpretation.","id":"transfer","hints":["A slope is change in vertical quantity divided by change in horizontal quantity. Its units come from that ratio, not from the visual angle of a line on a rescaled page.","Error bars can represent standard deviation, standard error or a confidence interval. Their meaning must be specified; overlap alone is not a universal significance test."]}]},{"id":"ph-12-07-workshop-v1","title":"Applying Data","asset":"ph12-07","stages":[{"id":"map","type":"selection","prompt":"Select the influence that can distort the exposure–outcome comparison.","answer":["part-1"],"explanation":"The relevant diagram entity or entities are Confounding. Applying data requires matching a claim to the study design, measurement and population. A precise estimate can still be biased if the underlying comparison is flawed.","hints":["Identify the physical or reasoning role described before selecting its schematic entity.","Relative and absolute effects answer different questions. Reducing risk from 0.02 to 0.01 is a 50% relative reduction but only a 0.01 absolute reduction."]},{"type":"number","prompt":"Risk falls from 0.02 to 0.01. Find relative risk reduction as a fraction.","answer":0.5,"unit":"dimensionless","tolerance":0,"explanation":"Relative reduction = (0.02 - 0.01)/0.02 = 0.5.","id":"reason","hints":["Applying data requires matching a claim to the study design, measurement and population. A precise estimate can still be biased if the underlying comparison is flawed.","Relative and absolute effects answer different questions. Reducing risk from 0.02 to 0.01 is a 50% relative reduction but only a 0.01 absolute reduction."]},{"type":"choice","prompt":"An observational study finds an exposure associated with an outcome. Which conclusion is warranted without further design support?","options":["An association was observed; causation remains uncertain","The exposure certainly caused the outcome","Confounding is impossible","A small p-value removes all bias"],"answer":0,"explanation":"Observed association alone does not rule out confounding, selection or other explanations.","id":"transfer","hints":["Relative and absolute effects answer different questions. Reducing risk from 0.02 to 0.01 is a 50% relative reduction but only a 0.01 absolute reduction.","Check denominators, missing data and uncertainty before comparing groups. A subgroup pattern can differ from an aggregate pattern when group composition changes."]}]}]}],"assets":{"version":1,"assets":[{"id":"ph01-01","kind":"concept-schematic","title":"Units","context":"Original illustrative physics or reasoning schematic; not an experimental measurement, scale drawing or complete apparatus. Use the assumptions and values in the current prompt for calculations.","reviewNote":"Original author-created model. Direction, sign convention, geometry and applicability require independent scientific review. Schematic proportions and animation speeds are not measured.","nodes":[{"id":"part-0","label":"Mass","x":110,"y":55},{"id":"part-1","label":"Length","x":290,"y":55},{"id":"part-2","label":"Time"
